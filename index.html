button,input,select,textarea{font:inherit;color:inherit}
header{background:#04123f;color:var(--gold);padding:12px 18px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:17px;margin:0;flex:1;font-weight:700}
header small{opacity:.75}
.menugrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;position:relative}
.menugrid button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:var(--gold);color:#04123f;padding:10px 2px;border-radius:12px;cursor:pointer;font-weight:600;font-size:10.5px;position:relative;min-height:72px;line-height:1.3;overflow:hidden}
.ribbon{position:absolute;top:8px;left:-24px;background:#c0392b;color:#fff;font-size:8px;padding:2px 24px;transform:rotate(-45deg);z-index:2}
.menugrid button .ic{width:20px;height:20px}
.menugrid button .ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6}
main{max-width:860px;margin:0 auto;padding:16px;padding-bottom:78px;display:flex;flex-direction:column;min-height:calc(100vh - 120px)}
.bottombar{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-evenly;height:54px;background:var(--gold);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6;max-width:860px;margin:0 auto}
.bottombar button{flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:0;background:none;padding:8px;border-radius:99px;cursor:pointer;color:#04123f}
.bottombar button .ic{width:26px;height:26px;display:block}
.bottombar button .ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6}
.bottombar button.on .ic svg{stroke-width:2.4}
.bottombar button.on{background:#04123f;color:var(--gold)}
.bottombar button .ic img{width:100%;height:100%;object-fit:cover;border-radius:99px}
.bottombar button.on .ic img{outline:2px solid var(--gold,#fec40b);outline-offset:1px}
.card{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:16px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #04123f;box-shadow:0 0 0 4px var(--gold)}
.btn{background:var(--navy);color:#fff;border:0;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:500}
.btn.alt{background:var(--gold);color:#04123f}.btn.sm{padding:5px 12px;font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 10px;border-radius:99px;background:var(--bg);color:var(--gray);border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.wa{color:var(--warn);border-color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.meta{font-size:12px;color:var(--gray)}
.paper{background:repeating-linear-gradient(transparent,transparent 31px,var(--line) 32px);line-height:32px;padding:0 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;background-color:var(--card)}
.paper h4{margin:0;line-height:38px;border-bottom:2px solid var(--gold)}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
.login .top{background:var(--gold);border-bottom:4px solid #04123f;color:#04123f;border-radius:14px 14px 0 0;padding:26px;text-align:center}
.login .top h2{margin:0 0 4px}.login .card{border-radius:0 0 14px 14px;margin:0}
body.no-bgimg{background-image:none!important;background-color:var(--bg)}
.login input{background:#fff;color:#04123f}
.err{color:#c0392b;font-size:13px;min-height:20px}
.card .card{background:var(--bg);border:1px solid var(--line)}.ann{border-inline-start:4px solid var(--navy)!important}header .btn{background:var(--gold);color:#04123f}main>.meta{color:#fff}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modalbox{background:var(--card);border-radius:14px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;padding:20px 18px 18px;position:relative}
.modalbox h3{margin-top:0}
.modalclose{position:absolute;top:10px;left:10px;background:none;border:0;font-size:20px;cursor:pointer;color:var(--ink);line-height:1}
.msgrow{display:flex;gap:6px;margin-bottom:10px;align-items:flex-end}
.msgrow.me{justify-content:flex-start}
.msgrow.other{justify-content:flex-end}
.bubble{max-width:72%;padding:6px 10px 5px;border-radius:12px}
.bubble.me{background:#04123f;color:#fff;border-bottom-left-radius:3px}
.bubble.other{background:var(--card);border:1px solid var(--line);border-bottom-right-radius:3px}
.bubble .bname{font-size:12px;font-weight:700;margin-bottom:2px;color:var(--gold)}
.bubble.other .bname{color:#04123f}
.bubble .btext{font-size:13px;word-break:break-word}
.bubble .btime{font-size:10px;opacity:.7;text-align:left;margin-top:3px}
.datechip{text-align:center;margin:10px 0;position:sticky;top:0;z-index:3}
.datechip span{background:#04123f;color:var(--gold);padding:3px 12px;border-radius:99px;font-size:11px}
.chatbar{position:fixed;left:0;right:0;bottom:54px;max-width:860px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:4px;z-index:5}
.chatbar input{margin:0;flex:1}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.igcell{position:relative;aspect-ratio:1/1;overflow:hidden;cursor:pointer;border-radius:8px;border:2px solid var(--gold)}
@media (max-width:640px){.ig-reply,.chat-reply{display:none}}
.igcell img{width:100%;height:100%;object-fit:cover;display:block}
.igframe{position:relative;width:100%;aspect-ratio:1/1;background:#000;overflow:hidden}
.igframe img{width:100%;height:100%;object-fit:contain;display:block}
.igarrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);color:#fff;border:0;width:30px;height:30px;border-radius:99px;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.igarrow.left{left:8px}.igarrow.right{right:8px}
.igdots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.igdots span{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.5)}
.igdots span.on{background:#fff}
.bookgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.bookcard{position:relative;background:#04123f;border-radius:14px 4px 4px 14px;aspect-ratio:3/4;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:2px 3px 6px rgba(0,0,0,.3);padding:10px}
.bookcard::after{content:"";position:absolute;right:7px;top:10px;bottom:10px;width:6px;background-image:radial-gradient(circle,#fff 2px,transparent 2.5px);background-size:6px 14px;background-repeat:repeat-y;opacity:.55}
.bicon{display:none}
.btitle{background:var(--gold);color:#04123f;font-size:11px;font-weight:700;padding:10px 6px;border-radius:4px;text-align:center;width:75%}
</style>

async function uploadImage(f){
 if(sb){try{
  const path=Date.now()+"_"+Math.random().toString(36).slice(2)+"_"+f.name.replace(/[^a-zA-Z0-9._-]/g,"");
  const {error}=await sb.storage.from("uploads").upload(path,f);

  const {data}=sb.storage.from("uploads").getPublicUrl(path);
  return data.publicUrl;
 }catch(e){}}
 return await fileToDataURL(f);
}

function qc(){
 const term=q.trim();
 const sel=window.__qcSel;
 let sugg=[];
 if(term&&!sel){
  const vals=new Map();
  S.qc.forEach(r=>{
   if(r.c&&r.c.includes(term))vals.set("c|"+r.c,{type:"c",val:r.c});
   if(r.p&&r.p.includes(term))vals.set("p|"+r.p,{type:"p",val:r.p});
   if(r.o&&r.o.includes(term))vals.set("o|"+r.o,{type:"o",val:r.o});
  });
  sugg=[...vals.values()].slice(0,10);
 }
 let hits=[];
 if(sel){
  if(sel.type=="c")hits=S.qc.filter(r=>r.c==sel.val);
  else if(sel.type=="p")hits=S.qc.filter(r=>r.p==sel.val);
  else hits=S.qc.filter(r=>r.o==sel.val);
 }
 const groups={};hits.forEach(r=>{(groups[r.c]=groups[r.c]||[]).push(r)});
 $("#v").innerHTML=`<div class="card"><h3>جستجو</h3><div class="row"><input id="qs" placeholder="نام مشتری، نام محصول یا شماره سفارش" value="${sel?esc(sel.val):esc(q)}">${sel?`<button class="btn sm alt" id="qclr" style="flex:0 0 auto">✕</button>`:""}${can("qc")?`<button class="btn sm" id="qnew" style="flex:0 0 auto">+ ثبت جدید</button>`:""}</div>
 ${!sel&&term?(sugg.length?`<div class="card" style="padding:4px">${sugg.map(s=>`<div data-sug="${s.type}|${esc(s.val)}" style="padding:8px 6px;cursor:pointer;border-bottom:1px solid var(--line)">${s.type=="c"?"مشتری":s.type=="p"?"محصول":"سفارش"}: ${esc(s.val)}</div>`).join("")}</div>`:'<p class="meta">موردی پیدا نشد.</p>'):""}
 ${sel?(Object.keys(groups).length?Object.entries(groups).map(([cust,items])=>`<div class="card"><b>${esc(cust)}</b>${items.map((r,i)=>`<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px">${i+1}. ${r.p?`<span class="tag">${esc(r.p)}</span> `:""}${r.o?`<span class="tag">سفارش ${esc(r.o)}</span> `:""}${esc(r.t)} ${can("qc")?`<a href="#" data-editqc="${r.id}" style="color:var(--navy,#04123f)">ویرایش</a>`:""}</div>`).join("")}</div>`).join(""):'<p class="meta">موردی پیدا نشد.</p>'):(!term?'<p class="meta">برای جستجو، نام مشتری، محصول یا شماره سفارش را بنویسید.</p>':"")}
 </div>`;
 const qs=$("#qs");
 if(!sel){qs.oninput=()=>{q=qs.value;qc();const n=$("#qs");n.focus();n.setSelectionRange(q.length,q.length)}}
 else{qs.readOnly=true}
 document.querySelectorAll("[data-sug]").forEach(d=>d.onclick=()=>{const [ty,...rest]=d.dataset.sug.split("|");window.__qcSel={type:ty,val:rest.join("|")};qc()});
 const clr=document.getElementById("qclr");if(clr)clr.onclick=()=>{window.__qcSel=null;q="";qc()};
 if(can("qc"))$("#qnew").onclick=()=>openQcModal();
 document.querySelectorAll("[data-editqc]").forEach(a=>a.onclick=(e)=>{e.preventDefault();openQcModal(+a.dataset.editqc)});
}

const JMONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
function persianParts(d){
 const f=new Intl.DateTimeFormat("en-US-u-ca-persian",{year:"numeric",month:"numeric",day:"numeric"});
 const o={};f.formatToParts(d).forEach(x=>o[x.type]=x.value);
 return {y:+o.year,m:+o.month,d:+o.day};
}
function jalaliToDate(jy,jm,jd){
 let est=new Date(Date.UTC(jy+621,2,20));
 est.setUTCDate(est.getUTCDate()+(jm-1)*30+(jd-1));
 for(let off=-6;off<=6;off++){const c=new Date(est.getTime()+off*86400000);const pp=persianParts(c);if(pp.y==jy&&pp.m==jm&&pp.d==jd)return c}
 return est;
}
function daysInJalaliMonth(jy,jm){for(let d=31;d>=29;d--){const pp=persianParts(jalaliToDate(jy,jm,d));if(pp.y==jy&&pp.m==jm&&pp.d==d)return d}return 29}
function isoFromJalali(jy,jm,jd){const dt=jalaliToDate(jy,jm,jd);return dt.getUTCFullYear()+"-"+String(dt.getUTCMonth()+1).padStart(2,"0")+"-"+String(dt.getUTCDate()).padStart(2,"0")}

function shift(){

 ${keys.length?keys.map(k=>{const [d,sh]=k.split("|");const items=g[k];const rec=S.shiftReceipts[k];
 const received=rec&&rec.upto>=items.length;
 return `<div class="card" data-shg="${k}" style="cursor:pointer"><b>${fd(d)} — شیفت ${sh}</b><br><span class="tag ${received?"ok":"wa"}">${received?"دریافت شده توسط "+esc(uname(rec.by)):"منتظر تأیید دریافت"}</span></div>`}).join(""):'<p class="meta">هنوز مطلبی ثبت نشده است.</p>'}`;

 const [d,sh]=k.split("|");
 const rec=S.shiftReceipts[k];
 const received=rec&&rec.upto>=items.length;
 openModal(`<h3>${fd(d)} — شیفت ${sh}</h3>
 ${items.map((s,i)=>`<div style="padding:6px 0;border-bottom:1px solid var(--line);${rec&&i<rec.upto?"color:var(--gray)":""}">${i+1}. ${esc(s.t)} <span class="meta">(${esc(uname(s.by))} · ${fd(s.at,1)})</span></div>`).join("")}

function openShiftModal(){
 const todayP=persianParts(new Date());
 if(window.__shY==null){window.__shY=todayP.y;window.__shM=todayP.m;window.__shD=todayP.d}
 window.__shLines=[];
 const yrs=[];for(let y=todayP.y-3;y<=todayP.y+1;y++)yrs.push(y);
 function render(){
  const dim=daysInJalaliMonth(window.__shY,window.__shM);
  if(window.__shD>dim)window.__shD=dim;
  return `<h3>ثبت تحویل شیفت</h3><div class="row">
 <select id="mshd">${Array.from({length:dim},(_,i)=>i+1).map(d=>`<option value="${d}" ${d==window.__shD?"selected":""}>${d}</option>`).join("")}</select>
 <select id="mshm">${JMONTHS.map((mn,i)=>`<option value="${i+1}" ${i+1==window.__shM?"selected":""}>${mn}</option>`).join("")}</select>
 <select id="mshy">${yrs.map(y=>`<option value="${y}" ${y==window.__shY?"selected":""}>${y}</option>`).join("")}</select>
 <select id="mss"><option value="روز">شیفت روز</option><option value="شب">شیفت شب</option></select></div>
 ${window.__shLines.length?`<div class="card">${window.__shLines.map((l,i)=>`<div>${i+1}. ${esc(l)}</div>`).join("")}</div>`:""}
 <input id="mst" placeholder="یک مورد را بنویسید و Enter بزنید">
 <button class="btn" id="msb">پایان و ثبت</button>`;
 }
 function wire(){
  $("#mshy").onchange=()=>{window.__shY=+$("#mshy").value;openModal(render());wire()};
  $("#mshm").onchange=()=>{window.__shM=+$("#mshm").value;openModal(render());wire()};
  $("#mshd").onchange=()=>{window.__shD=+$("#mshd").value};
  $("#mst").onkeydown=(e)=>{if(e.key=="Enter"){e.preventDefault();const v=$("#mst").value.trim();if(v){window.__shLines.push(v);openModal(render());wire();$("#mst").focus()}}};
  $("#msb").onclick=()=>{const v=$("#mst").value.trim();if(v)window.__shLines.push(v);
   if(!window.__shLines.length)return;
   const iso=isoFromJalali(window.__shY,window.__shM,window.__shD);
   const k=iso+"|"+$("#mss").value;
   window.__shLines.forEach(t=>S.shifts.push({id:nid(),date:iso,sh:$("#mss").value,t,by:me.id}));
   save("shifts");closeModal();shift()};
 }
 openModal(render());wire();
}

function chartTree(){
 const byParent={};
 S.users.filter(u=>u.on).forEach(u=>{const p=S.chart[u.id]||"";(byParent[p]=byParent[p]||[]).push(u)});
 function render(pid,depth){
  return (byParent[pid]||[]).map(u=>`<div style="padding-inline-start:${depth*20}px;padding:4px 0">${depth?"└ ":""}<b>${esc(u.name)}</b> <span class="tag">${ROLES[u.role]}</span></div>${render(u.id,depth+1)}`).join("");
 }
 const tree=render("",0);
 return tree||'<p class="meta">هنوز چارتی تعریف نشده است.</p>';
}
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}

 document.querySelectorAll("[data-cdel]").forEach(a=>a.onclick=(e)=>{e.preventDefault();p.comments=p.comments.filter(x=>x.id!=a.dataset.cdel&&x.parent!=a.dataset.cdel);save("posts");qcgramPost(id)});
 const frame=document.getElementById("igframe");
 if(frame&&p.images.length>1){

function readKey(gid){return gid+":"+me.id}

function totalUnread(){return S.groups.filter(g=>g.members.includes(me.id)).reduce((s,g)=>s+groupUnread(g.id),0)}
function markRead(gid){S.reads[readKey(gid)]=Date.now();save("reads")}

function groupChat(gid){
 const g=S.groups.find(x=>x.id==gid);
 if(!g){window.__openGroup=null;return colleague()}
 markRead(gid);
 const msgs=S.gmsgs.filter(m=>m.groupId==gid).sort((a,b)=>a.at-b.at);
 const M=id=>S.gmsgs.find(x=>x.id==id);
 let lastDate=null;
 const rows=msgs.map(m=>{const rp=m.parent?M(m.parent):null;const mine=m.from==me.id;
 const dchip=fd(m.at);let chip="";
 if(dchip!=lastDate){chip=`<div class="datechip"><span>${dchip}</span></div>`;lastDate=dchip}
 return `${chip}<div class="msgrow ${mine?"me":"other"}" data-msgid="${m.id}">
 ${!mine?avatar(m.from):""}
 <div class="bubble ${mine?"me":"other"}">
 ${!mine?`<div class="bname">${esc(uname(m.from))}</div>`:""}
 ${rp?`<div class="meta" style="opacity:.8;border-inline-start:2px solid currentColor;padding-inline-start:6px;margin-bottom:3px">${esc(uname(rp.from))}: ${esc((rp.text||"تصویر").slice(0,40))}</div>`:""}
 ${m.image?`<img src="${m.image}" style="max-width:100%;border-radius:8px;margin-bottom:3px;display:block">`:""}
 ${m.text?`<div class="btext">${esc(m.text)}${m.edited?' <span style="opacity:.6;font-size:10px">(ویرایش‌شده)</span>':""}</div>`:""}
 <div class="btime">${fd(m.at,1).split(" ").slice(-1)[0]}</div>
 </div></div>`}).join("");
 $("#v").innerHTML=`<div class="row" style="align-items:center"><button class="btn sm alt" id="gback" style="flex:0 0 auto">→ بازگشت</button><h3 style="flex:1;margin:0;cursor:pointer" id="gtitle">${esc(g.name)}</h3></div>
 <div style="max-height:60vh;overflow-y:auto;padding:4px" id="gmsgbox">${msgs.length?rows:'<p class="meta">هنوز پیامی نیست.</p>'}</div>
 <div class="meta" id="greplybox" style="display:none;margin:6px 0"></div>
 <div class="chatbar">
 <input id="gtxt" placeholder="پیام...">
 <label style="cursor:pointer;padding:4px">📎<input type="file" id="gimg" accept="image/*" style="display:none"></label>
 <label style="cursor:pointer;padding:4px">📷<input type="file" id="gcam" accept="image/*" capture="environment" style="display:none"></label>
 <button class="btn sm" id="gsend" style="flex:0 0 auto;border-radius:99px;width:36px;height:36px;padding:0">➤</button>
 </div>
 <div id="gsug" style="display:none;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:6px;overflow:hidden;position:fixed;bottom:100px;left:16px;right:16px;max-width:828px;margin:0 auto;z-index:7"></div>
 <div id="gmenu" style="display:none;position:fixed;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:20;overflow:hidden"></div>`;
 const box=$("#gmsgbox");box.scrollTop=box.scrollHeight;box.style.paddingBottom="8px";
 $("#v").style.paddingBottom="140px";
 $("#gback").onclick=()=>{window.__openGroup=null;colleague()};
 $("#gtitle").onclick=()=>groupInfo(gid);
 let replyTo=null;
 function setReply(mid){replyTo=mid;const rm=M(mid);
  $("#greplybox").style.display="block";$("#greplybox").innerHTML=`در پاسخ به ${esc(uname(rm.from))}: ${esc((rm.text||"تصویر").slice(0,40))} <a href="#" id="gcancelreply">✕</a>`;
  document.getElementById("gcancelreply").onclick=(ev)=>{ev.preventDefault();replyTo=null;$("#greplybox").style.display="none"};
  $("#gtxt").focus();}
 function closeMenu(){$("#gmenu").style.display="none"}
 function openMsgMenu(m,x,y){
  const mine=m.from==me.id;
  const isMobile=window.innerWidth<=640;
  const items=[];
  if(!isMobile)items.push(["پاسخ",()=>{setReply(m.id);closeMenu()}]);
  if(m.text)items.push(["کپی",()=>{navigator.clipboard&&navigator.clipboard.writeText(m.text);closeMenu()}]);
  items.push(["انتقال",()=>{closeMenu();openForwardModal(m)}]);
  if(mine&&m.text)items.push(["ویرایش",()=>{closeMenu();const nt=prompt("ویرایش پیام:",m.text);if(nt==null)return;m.text=nt.trim();m.edited=true;save("gmsgs");groupChat(gid)}]);
  if(mine||me.role=="manager")items.push(["حذف",()=>{closeMenu();if(!confirm("این پیام برای همه حذف شود؟"))return;S.gmsgs=S.gmsgs.filter(x=>x.id!=m.id);save("gmsgs");groupChat(gid)}]);
  const menu=$("#gmenu");
  menu.innerHTML=items.map(([label],i)=>`<div data-mi="${i}" style="padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--line)">${label}</div>`).join("");
  menu.style.display="block";
  const mw=180,vw=window.innerWidth,vh=window.innerHeight;
  menu.style.left=Math.min(x,vw-mw-10)+"px";menu.style.top=Math.min(y,vh-220)+"px";

 }
 document.addEventListener("click",closeMenu,{once:true});
 document.querySelectorAll(".msgrow").forEach(row=>{
  const mid=row.dataset.msgid;const m=M(mid);
  row.oncontextmenu=(e)=>{e.preventDefault();openMsgMenu(m,e.clientX,e.clientY)};
  let t=null;
  row.addEventListener("touchstart",(e)=>{t=setTimeout(()=>{const touch=e.touches[0];openMsgMenu(m,touch.clientX,touch.clientY)},500)});
  row.addEventListener("touchend",()=>clearTimeout(t));
  row.addEventListener("touchmove",()=>clearTimeout(t));
 });
 const memberNames=g.members.filter(id=>id!=me.id).map(id=>uname(id));
 $("#gtxt").oninput=()=>{
  const v=$("#gtxt").value;
  const mm=v.match(/@([^\s@]*)$/);
  const sug=$("#gsug");
  if(!mm){sug.style.display="none";sug.innerHTML="";return}
  const partial=mm[1];
  const matches=memberNames.filter(n=>n.includes(partial));
  if(!matches.length){sug.style.display="none";sug.innerHTML="";return}
  sug.style.display="block";
  sug.innerHTML=matches.map(n=>`<div data-mn="${esc(n)}" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)">@${esc(n)}</div>`).join("");
  sug.querySelectorAll("[data-mn]").forEach(el=>el.onclick=()=>{
   $("#gtxt").value=v.slice(0,mm.index)+"@"+el.dataset.mn+" ";
   sug.style.display="none";sug.innerHTML="";$("#gtxt").focus();
  });
 };
 async function sendWith(image){
  const t=$("#gtxt").value.trim();if(!t&&!image)return;
  S.gmsgs.push({id:nid(),groupId:gid,from:me.id,text:t,image:image||null,at:Date.now(),parent:replyTo});
  replyTo=null;markRead(gid);save("gmsgs");groupChat(gid);
 }
 $("#gsend").onclick=()=>sendWith(null);
 $("#gimg").onchange=async()=>{const f=$("#gimg").files[0];if(!f)return;const url=await uploadImage(f);sendWith(url)};
 $("#gcam").onchange=async()=>{const f=$("#gcam").files[0];if(!f)return;const url=await uploadImage(f);sendWith(url)};
}
function openForwardModal(m){
 const mine=S.groups.filter(g=>g.members.includes(me.id));
 openModal(`<h3>انتقال پیام به...</h3>${mine.map(g=>`<div data-fwg="${g.id}" style="padding:10px;cursor:pointer;border-bottom:1px solid var(--line)">${esc(g.name)}</div>`).join("")}`);
 document.querySelectorAll("[data-fwg]").forEach(el=>el.onclick=()=>{const gid2=+el.dataset.fwg;
  S.gmsgs.push({id:nid(),groupId:gid2,from:me.id,text:m.text||"",image:m.image||null,at:Date.now(),parent:null});
  save("gmsgs");closeModal();window.__openGroup=gid2;markRead(gid2);colleague()});
}

function train(){
 $("#v").innerHTML=`<div class="row" style="align-items:center"><h3 style="flex:1;margin:0">آموزش‌ها</h3>${can("train")?`<button class="btn sm" id="trnew" style="flex:0 0 auto">+ ثبت آموزش جدید</button>`:""}</div>
 ${S.trainings.length?`<div class="bookgrid">${S.trainings.map(t=>`<div class="bookcard" data-op="${t.id}"><div class="bicon">📘</div><div class="btitle">${esc(t.title)}</div></div>`).join("")}</div>`:'<p class="meta">هنوز مطلبی ثبت نشده است.</p>'}`;
 if(can("train"))$("#trnew").onclick=()=>openTrainModal();
 document.querySelectorAll("[data-op]").forEach(b=>b.onclick=()=>{const t=S.trainings.find(x=>x.id==b.dataset.op);if(!t)return;
  const media=t.image?(t.kind=="pdf"?`<p><a href="${t.image}" target="_blank" class="tag">📄 مشاهده فایل پی‌دی‌اف</a></p>`:`<img src="${t.image}" style="width:100%;border-radius:8px;margin-bottom:8px">`):"";
  openModal(`<h3>${esc(t.title)}</h3>${media}<p>${esc(t.text)}</p><div class="meta">${esc(uname(t.by))} · ${fd(t.at,1)}</div>`)});
}
function openTrainModal(){
 openModal(`<h3>مطلب آموزشی جدید</h3><input id="mtrt" placeholder="عنوان"><textarea id="mtrx" rows="3" placeholder="متن آموزشی"></textarea><input type="file" id="mtri" accept="image/*,application/pdf,.pdf"><div class="err" id="mtre"></div><button class="btn sm" id="mtrb">ثبت</button>`);
 $("#mtrb").onclick=async()=>{const ti=$("#mtrt").value.trim(),tx=$("#mtrx").value.trim();if(!ti||!tx)return $("#mtre").textContent="عنوان و متن را وارد کنید.";
  const f=$("#mtri").files[0];const image=f?await uploadImage(f):null;const kind=f&&(f.type=="application/pdf"||f.name.toLowerCase().endsWith(".pdf"))?"pdf":"image";
  S.trainings.push({id:nid(),title:ti,text:tx,image,kind,by:me.id,at:Date.now()});save("trainings");closeModal();train()};
}

function nc(){
 const CAUSE={human:"نیروی انسانی",method:"روش کار"};
 const mine=S.nc.filter(n=>me.role=="manager"||n.by==me.id||n.to[0]==me.id||n.holder==me.id).slice().sort((a,b)=>(a.status=="closed")-(b.status=="closed")||b.at-a.at);
 const others=S.users.filter(u=>u.on&&u.id!=me.id&&S.perms.ncresponder.includes(u.role));
 $("#v").innerHTML=`<div class="row" style="align-items:center"><h3 style="flex:1;margin:0">عدم انطباق‌ها</h3>${can("nc")?`<button class="btn sm" id="ncnew" style="flex:0 0 auto">+ ثبت جدید</button>`:""}</div>
 ${mine.length?mine.map(n=>{
 const closed=n.status=="closed";const mineHold=n.holder==me.id;const owner=me.id==n.by||me.role=="manager";
 return `<div class="card">${!closed?`<span class="tag wa">باز</span> `:""}<b>${esc(n.subject)}</b> <span class="tag ${closed?"ok":"wa"}">${closed?"بسته":n.status=="awaiting_manager"?"در انتظار تأیید مدیر":"در جریان"}</span>
 <p class="meta">ثبت‌کننده: ${esc(uname(n.by))} · دست: ${esc(uname(n.holder))} · گردش: ${n.to.map(uname).join(" ← ")}</p>
 <p>${esc(n.desc)}</p>
 <div class="meta">${n.trail.map(h=>`${esc(uname(h.by))}: ${esc(h.note||h.type)} (${fd(h.at,1)})`).join("<br>")}</div>
 ${n.cause?`<p class="meta">عامل: ${CAUSE[n.cause]||""} ${n.offenders&&n.offenders.length?"· افراد: "+n.offenders.map(uname).join("، "):""}${n.corrective?"<br>اقدام اصلاحی: "+esc(n.corrective):""}</p>`:""}
 ${!closed&&mineHold&&me.id!=n.to[0]?`<div class="row"><select data-fwd="${n.id}"><option value="">ارسال به...</option>${S.users.filter(u=>u.on&&u.id!=n.holder&&S.perms.ncresponder.includes(u.role)).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select><input placeholder="یادداشت" data-fnote="${n.id}"></div><button class="btn sm" data-fb="${n.id}">ارسال به نفر بعد</button>`:""}
 ${!closed&&mineHold&&me.id==n.to[0]&&n.status=="in_progress"?`<div class="card"><select data-cause="${n.id}"><option value="">عامل را انتخاب کنید</option><option value="human">نیروی انسانی</option><option value="method">روش کار</option></select><select multiple data-off="${n.id}" style="min-height:70px">${S.users.filter(u=>u.on).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select><textarea data-corr="${n.id}" rows="2" placeholder="اقدام اصلاحی"></textarea><button class="btn sm" data-concl="${n.id}">ثبت نتیجه‌گیری و ارسال برای تأیید مدیر</button></div>`:""}
 ${!closed&&owner&&n.status=="awaiting_manager"?`<button class="btn sm" data-appr="${n.id}">تأیید و بستن</button> <button class="btn sm alt" data-rej="${n.id}">رد و بازگشت</button>`:""}
 ${!closed&&(owner||me.id==n.to[0])&&n.holder!=me.id?`<button class="btn sm alt" data-pull="${n.id}">بازپس‌گیری با یادداشت</button>`:""}
 </div>`}).join(""):'<p class="meta">موردی برای نمایش نیست.</p>'}
 ${me.role=="manager"?ncReport():""}`;
 if(can("nc"))$("#ncnew").onclick=()=>openNcModal(others);
 const N=id=>S.nc.find(x=>x.id==id);
 document.querySelectorAll("[data-fb]").forEach(b=>b.onclick=()=>{const n=N(+b.dataset.fb);const to=+document.querySelector(`[data-fwd="${n.id}"]`).value;if(!to)return;
  const note=document.querySelector(`[data-fnote="${n.id}"]`).value.trim();n.to.push(to);n.holder=to;n.trail.push({by:me.id,type:"ارجاع",note,at:Date.now()});save("nc");nc()});
 document.querySelectorAll("[data-concl]").forEach(b=>b.onclick=()=>{const n=N(+b.dataset.concl);const cause=document.querySelector(`[data-cause="${n.id}"]`).value;
  const offs=[...document.querySelector(`[data-off="${n.id}"]`).selectedOptions].map(o=>+o.value);const corr=document.querySelector(`[data-corr="${n.id}"]`).value.trim();
  if(!cause||!corr)return;n.cause=cause;n.offenders=cause=="human"?offs:[];n.corrective=corr;n.status="awaiting_manager";n.holder=n.by;n.trail.push({by:me.id,type:"نتیجه‌گیری",note:corr,at:Date.now()});save("nc");nc()});
 document.querySelectorAll("[data-appr]").forEach(b=>b.onclick=()=>{const n=N(+b.dataset.appr);n.status="closed";n.trail.push({by:me.id,type:"تأیید و بستن",at:Date.now()});save("nc");nc()});
 document.querySelectorAll("[data-rej]").forEach(b=>b.onclick=()=>{const n=N(+b.dataset.rej);n.status="in_progress";n.holder=n.to[0];n.trail.push({by:me.id,type:"رد شد",note:"بازگشت برای اصلاح",at:Date.now()});save("nc");nc()});
 document.querySelectorAll("[data-pull]").forEach(b=>b.onclick=()=>{const n=N(+b.dataset.pull);n.holder=me.id;n.status="in_progress";n.trail.push({by:me.id,type:"بازپس‌گیری",at:Date.now()});save("nc");nc()});
}
function openNcModal(others){
 openModal(`<h3>ثبت عدم انطباق جدید</h3><input id="mns" placeholder="موضوع"><textarea id="mnd" rows="2" placeholder="شرح"></textarea><select id="mnto">${others.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select><div class="err" id="mne"></div><button class="btn sm" id="mnb">ارسال</button>`);
 $("#mnb").onclick=()=>{const su=$("#mns").value.trim(),de=$("#mnd").value.trim(),to=+$("#mnto").value;
  if(!su||!de)return $("#mne").textContent="موضوع و شرح را وارد کنید.";
  S.nc.push({id:nid(),subject:su,desc:de,by:me.id,at:Date.now(),to:[to],holder:to,status:"in_progress",cause:"",offenders:[],corrective:"",trail:[{by:me.id,type:"ایجاد",note:de,at:Date.now()}]});save("nc");closeModal();nc()};
}
function suggUnread(){
 if(me.role=="manager")return S.suggestions.filter(s=>s.by!=me.id&&s.at>(S.suggReads[me.id]||0)).length;
 return S.suggestions.filter(s=>s.by==me.id&&s.reply&&s.replyAt>(S.suggReads[me.id]||0)).length;
}
function complaintsUnseen(){return S.complaints.filter(c=>!S.complaintSeen[c.id+":"+me.id]).length}
function suggestions(){
 S.suggReads[me.id]=Date.now();save("suggReads");
 if(me.role=="manager"){
  const list=S.suggestions.slice().reverse();
  $("#v").innerHTML=`<h3>صندوق انتقادات و پیشنهادات</h3>
  ${list.length?list.map(s=>`<div class="card">${!s.reply?'<span class="tag wa">بدون پاسخ</span>':'<span class="tag ok">پاسخ داده شده</span>'}
  <p>${esc(s.text)}</p><div class="meta">${esc(uname(s.by))} · ${fd(s.at,1)}</div>
  ${s.reply?`<div class="card"><b>پاسخ:</b> ${esc(s.reply)}<div class="meta">${fd(s.replyAt,1)}</div></div>`:`<textarea data-sr="${s.id}" rows="2" placeholder="پاسخ شما"></textarea><button class="btn sm" data-sb="${s.id}">ارسال پاسخ</button>`}
  </div>`).join(""):'<p class="meta">موردی ثبت نشده است.</p>'}`;
  document.querySelectorAll("[data-sb]").forEach(b=>b.onclick=()=>{const id=+b.dataset.sb;const s=S.suggestions.find(x=>x.id==id);
   const r=document.querySelector(`[data-sr="${id}"]`).value.trim();if(!r)return;s.reply=r;s.replyAt=Date.now();save("suggestions");suggestions()});
 }else{
  const mine=S.suggestions.filter(s=>s.by==me.id).slice().reverse();
  $("#v").innerHTML=`<div class="card"><h3>ارسال انتقاد یا پیشنهاد</h3><textarea id="sgt" rows="3" placeholder="متن خود را بنویسید"></textarea><button class="btn sm" id="sgb">ارسال</button></div>
  ${mine.length?`<h3>موارد ارسالی شما</h3>${mine.map(s=>`<div class="card">${!s.reply?'<span class="tag wa">بدون پاسخ</span>':'<span class="tag ok">پاسخ داده شده</span>'}<p>${esc(s.text)}</p><div class="meta">${fd(s.at,1)}</div>${s.reply?`<div class="card"><b>پاسخ مدیریت:</b> ${esc(s.reply)}</div>`:""}</div>`).join("")}`:""}`;
  $("#sgb").onclick=()=>{const t=$("#sgt").value.trim();if(!t)return;S.suggestions.push({id:nid(),by:me.id,text:t,at:Date.now(),reply:null,replyAt:null});save("suggestions");suggestions()};
 }
}
function complaints(){
 const openId=window.__openComplaint;
 if(openId){
  const c=S.complaints.find(x=>x.id==openId);
  if(c){
   S.complaintSeen[c.id+":"+me.id]=true;save("complaintSeen");
   $("#v").innerHTML=`<button class="btn sm alt" id="cxback" style="margin-bottom:12px">→ بازگشت</button>
   <div class="card"><h3>${esc(c.subject)}</h3><p>${esc(c.text)}</p>
   ${c.images&&c.images.length?`<div style="display:flex;gap:6px;overflow-x:auto">${c.images.map(im=>`<img src="${im}" style="width:70%;flex:0 0 auto;max-height:220px;object-fit:cover;border-radius:8px">`).join("")}</div>`:""}
   <div class="meta">${esc(uname(c.by))} · ${fd(c.at,1)}</div></div>`;
   $("#cxback").onclick=()=>{window.__openComplaint=null;complaints()};
   return;
  }
  window.__openComplaint=null;
 }
 const list=S.complaints.slice().reverse();
 $("#v").innerHTML=`<div class="row" style="align-items:center"><h3 style="flex:1;margin:0">شکایات</h3>${can("complaint")?`<button class="btn sm" id="cxnew" style="flex:0 0 auto">+ افزودن شکایت</button>`:""}</div>
 ${list.length?list.map(c=>`<div class="card" data-oc="${c.id}" style="cursor:pointer">${!S.complaintSeen[c.id+":"+me.id]?'<span class="tag wa">جدید</span> ':""}<b>${esc(c.subject)}</b><div class="meta">${esc(uname(c.by))} · ${fd(c.at,1)}</div></div>`).join(""):'<p class="meta">شکایتی ثبت نشده است.</p>'}`;
 document.querySelectorAll("[data-oc]").forEach(d=>d.onclick=()=>{window.__openComplaint=+d.dataset.oc;complaints()});
 const nb=document.getElementById("cxnew");if(nb)nb.onclick=()=>openComplaintModal();
}
function openComplaintModal(){
 openModal(`<h3>ثبت شکایت جدید</h3><input id="mcs" placeholder="موضوع"><textarea id="mct" rows="3" placeholder="متن شکایت"></textarea><input type="file" id="mci" accept="image/*" multiple><div class="err" id="mce"></div><button class="btn sm" id="mcb">ثبت</button>`);
 $("#mcb").onclick=async()=>{const su=$("#mcs").value.trim(),tx=$("#mct").value.trim();if(!su||!tx)return $("#mce").textContent="موضوع و متن را وارد کنید.";
  const files=[...$("#mci").files];const images=files.length?await Promise.all(files.map(uploadImage)):[];
  S.complaints.push({id:nid(),by:me.id,subject:su,text:tx,images,at:Date.now()});save("complaints");closeModal();complaints()};
}
function ncReport(){
 const off={},cau={human:0,method:0};let open=0,closed=0;
 S.nc.forEach(n=>{n.status=="closed"?closed++:open++;if(n.cause)cau[n.cause]++;(n.offenders||[]).forEach(o=>off[o]=(off[o]||0)+1)});
 return `<div class="card"><h3>گزارش عدم انطباق‌ها</h3><p>باز: ${open} · بسته: ${closed}</p><p>نیروی انسانی: ${cau.human} · روش کار: ${cau.method}</p>
 ${Object.keys(off).length?`<p>افراد خاطی:<br>${Object.entries(off).map(([id,c])=>`${esc(uname(id))}: ${c}`).join("<br>")}</p>`:""}</div>`;
}


boot();
</script>
