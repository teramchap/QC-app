button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--gold);color:#04123f;padding:12px 18px;border-bottom:3px solid #04123f;display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:17px;margin:0;flex:1;font-weight:700}
header small{opacity:.75}
.menugrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;position:relative}
.menugrid button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:#04123f;color:#fec40b;padding:10px 2px;border-radius:12px;cursor:pointer;font-weight:600;font-size:10.5px;position:relative;min-height:72px;line-height:1.3}
.menugrid button .ic{width:20px;height:20px}
.menugrid button .ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6}
main{max-width:860px;margin:0 auto;padding:16px;padding-bottom:78px;display:flex;flex-direction:column;min-height:calc(100vh - 120px)}
.bottombar{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-evenly;height:54px;background:#04123f;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6;max-width:860px;margin:0 auto}
.bottombar button{flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:0;background:none;padding:8px;border-radius:99px;cursor:pointer;color:var(--gold)}
.bottombar button .ic{width:26px;height:26px;display:block}
.bottombar button .ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6}
.bottombar button.on .ic svg{stroke-width:2.4}
.bottombar button.on{background:var(--gold);color:#04123f}
.bottombar button .ic img{width:100%;height:100%;object-fit:cover;border-radius:99px}
.bottombar button.on .ic img{outline:2px solid var(--navy,#04123f);outline-offset:1px}
.card{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:16px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #04123f;box-shadow:0 0 0 4px var(--gold)}
.btn{background:var(--navy);color:#fff;border:0;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:500}
.btn.alt{background:var(--gold);color:#04123f}.btn.sm{padding:5px 12px;font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 10px;border-radius:99px;background:var(--bg);color:var(--gray);border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.wa{color:var(--warn);border-color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.meta{font-size:12px;color:var(--gray)}
.paper{background:repeating-linear-gradient(transparent,transparent 31px,var(--line) 32px);line-height:32px;padding:0 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;background-color:var(--card)}
.paper h4{margin:0;line-height:38px;border-bottom:2px solid var(--gold)}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
.login .top{background:var(--gold);border-bottom:4px solid #04123f;color:#04123f;border-radius:14px 14px 0 0;padding:26px;text-align:center}
.login .top h2{margin:0 0 4px}.login .card{border-radius:0 0 14px 14px;margin:0}

.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}

<body>
<div id="app"></div>
<script>
window.onerror=function(msg,src,line){try{alert("یک خطا رخ داد (لطفاً این پیام را به سازنده بدهید):\n"+msg+" — خط "+line)}catch(e){}return false};
function toast(msg){
 try{
  let t=document.getElementById("toastbox");
  if(!t){t=document.createElement("div");t.id="toastbox";t.style.cssText="position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#04123f;color:#fec40b;padding:10px 18px;border-radius:99px;font-size:13px;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.25);transition:opacity .3s";document.body.appendChild(t)}
  t.textContent=msg;t.style.opacity="1";
  clearTimeout(window.__toastT);window.__toastT=setTimeout(()=>{t.style.opacity="0"},1600);
 }catch(e){}
}
const ROLES={manager:"مدیر",supervisor:"سرپرست",senior:"کارشناس ارشد",expert:"کارشناس"};
const PERMS={qc:"ثبت اطلاعات کیفی",announce:"درج اعلانات",shift:"ثبت اطلاعات شیفت",assign:"تعریف کار برای دیگران",qcgram:"انتشار پست QCgram",train:"ایجاد مطلب آموزشی",group:"ایجاد گروه گفتگو",complaint:"ثبت شکایت"};
const D0={users:[{id:1,name:"مدیر کیفیت",user:"modir",pass:"1234",role:"manager",on:1},{id:2,name:"سرپرست نمونه",user:"sarparast",pass:"1234",role:"supervisor",on:1},{id:3,name:"کارشناس ارشد نمونه",user:"arshad",pass:"1234",role:"senior",on:1},{id:4,name:"کارشناس نمونه",user:"karshenas",pass:"1234",role:"expert",on:1}],
perms:{qc:["manager","supervisor","senior","expert"],announce:["manager","supervisor"],shift:["manager","supervisor","senior","expert"],assign:["manager","supervisor","senior"]},
qc:[],tasks:[],shifts:[],ann:[],customers:["شرکت نمونه"]};
let S,me=null,tab="home",q="";
try{S=JSON.parse(localStorage.getItem("qcdb"))||D0}catch(e){S=D0}
S.customers=S.customers||[];S.posts=S.posts||[];S.msgs=S.msgs||[];S.trainings=S.trainings||[];S.nc=S.nc||[];S.chart=S.chart||{};
S.announcement=S.announcement||null;S.occasion=S.occasion||null;S.groups=S.groups||[];S.gmsgs=S.gmsgs||[];S.reads=S.reads||{};S.suggestions=S.suggestions||[];S.suggReads=S.suggReads||{};S.complaints=S.complaints||[];S.complaintSeen=S.complaintSeen||{};
S.perms.qcgram=S.perms.qcgram||["manager","supervisor"];S.perms.train=S.perms.train||["manager","supervisor"];S.perms.group=S.perms.group||["manager","supervisor"];S.perms.complaint=S.perms.complaint||["manager"];
const KEYS=["users","customers","perms","ann","qc","tasks","shifts","msgs","posts","trainings","nc","chart","announcement","occasion","groups","gmsgs","reads","suggestions","suggReads","complaints","complaintSeen"];
const SUPABASE_URL="https://rmowptvcexryfaagdyzo.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtb3dwdHZjZXhyeWZhYWdkeXpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4MTk0MjAsImV4cCI6MjEwNjM5NTQyMH0.LCVWMxOh04g5xlXiffS52Cydsfn9nEHsj344PjYQImY";
let sb=null,DBSTATE="nodb";
const save=()=>{
 try{localStorage.setItem("qcdb",JSON.stringify(S))}catch(e){}
 if(sb)KEYS.forEach(async k=>{try{const {error}=await sb.from("app_state").upsert({key:k,value:S[k],updated_at:new Date().toISOString()},{onConflict:"key"});if(error)DBSTATE="error"}catch(e){DBSTATE="error"}});
 toast("ذخیره شد");
};
async function uploadImage(f){
 if(sb){try{
  const path=Date.now()+"_"+Math.random().toString(36).slice(2)+"_"+f.name.replace(/[^a-zA-Z0-9._-]/g,"");
  const {error}=await sb.storage.from("uploads").upload(path,f);
  if(error)throw error;
  const {data}=sb.storage.from("uploads").getPublicUrl(path);
  return data.publicUrl;
 }catch(e){}}
 return await fileToDataURL(f);
}
async function loadFromDb(){
 const {data,error}=await sb.from("app_state").select("key,value");
 if(error){DBSTATE="error";return}
 (data||[]).forEach(row=>{if(row.value!==undefined&&row.value!==null)S[row.key]=row.value});
 S.customers=S.customers||[];S.posts=S.posts||[];S.msgs=S.msgs||[];S.trainings=S.trainings||[];S.nc=S.nc||[];S.chart=S.chart||{};
 S.announcement=S.announcement||null;S.occasion=S.occasion||null;S.groups=S.groups||[];S.gmsgs=S.gmsgs||[];S.reads=S.reads||{};S.suggestions=S.suggestions||[];S.suggReads=S.suggReads||{};S.complaints=S.complaints||[];S.complaintSeen=S.complaintSeen||{};
 S.ann=S.ann||[];S.qc=S.qc||[];S.tasks=S.tasks||[];S.shifts=S.shifts||[];
 S.users=(S.users&&S.users.length)?S.users:D0.users;S.perms=S.perms||D0.perms;
 S.perms.qcgram=S.perms.qcgram||["manager","supervisor"];S.perms.train=S.perms.train||["manager","supervisor"];S.perms.group=S.perms.group||["manager","supervisor"];S.perms.complaint=S.perms.complaint||["manager"];
 DBSTATE="ok";
 sb.channel("app_state_changes").on("postgres_changes",{event:"*",schema:"public",table:"app_state"},payload=>{
  const row=payload.new;if(row&&row.key){S[row.key]=row.value;if(me)shell()}
 }).subscribe();
}
async function boot(){
 try{
  if(typeof window.supabase!=="undefined"){
   sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
   await loadFromDb();
  }
 }catch(e){DBSTATE="error"}
 login();
}
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=(t,time)=>new Date(t).toLocaleString("fa-IR-u-ca-persian",time?{dateStyle:"medium",timeStyle:"short"}:{dateStyle:"medium"});
const can=p=>me.role=="manager"||S.perms[p].includes(me.role);
const uname=id=>(S.users.find(u=>u.id==id)||{}).name||"—";
const nid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const TABS=()=>[["qc","اطلاعات کیفی",`<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>`],["tasks","کارها و وظایف",`<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/><path d="M4 6l1.5 1.5L8 5"/></svg>`],["shift","تحویل شیفت‌ها",`<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>`],["train","آموزش‌ها",`<svg viewBox="0 0 24 24"><path d="M4 5c3-1.5 6-1.5 8 0v14c-2-1.5-5-1.5-8 0V5z"/><path d="M20 5c-3-1.5-6-1.5-8 0v14c2-1.5 5-1.5 8 0V5z"/></svg>`],["nc","عدم انطباق‌ها",`<svg viewBox="0 0 24 24"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg>`],["suggestions","انتقادات و پیشنهادات",`<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 2a6 6 0 00-3 11c.6.5 1 1.2 1 2h4c0-.8.4-1.5 1-2a6 6 0 00-3-11z"/></svg>`],["complaints","شکایات",`<svg viewBox="0 0 24 24"><path d="M6 3v18M6 4h12l-2 3.5 2 3.5H6"/></svg>`],...(me.role=="manager"?[["admin","مدیریت سامانه",`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>`]]:[])];

function login(){
 const warn=DBSTATE=="error"?`<p class="meta" style="color:#b7791f">⚠ اتصال به حافظه‌ی مشترک برقرار نشد؛ اطلاعات فقط روی همین دستگاه ذخیره می‌شود.</p>`:DBSTATE=="nodb"?`<p class="meta" style="color:#b7791f">⚠ این صفحه خارج از حالت آنلاین باز شده؛ اطلاعات با بقیه به اشتراک گذاشته نمی‌شود. برای اشتراک واقعی، از لینک منتشرشده استفاده کنید.</p>`:"";
 $("#app").innerHTML=`<div class="login"><div class="top"><h2>سامانه کنترل کیفیت</h2><small>برای ورود، نام کاربری و رمز عبور را وارد کنید</small></div>
 <div class="card"><input id="lu" placeholder="نام کاربری" autocomplete="username"><input id="lp" type="password" placeholder="رمز عبور" autocomplete="current-password">
 <div class="err" id="le"></div><button class="btn" style="width:100%" id="lb">ورود</button>
 <p class="meta">نمونه: modir / 1234</p>${warn}</div></div>`;
 $("#lb").onclick=()=>{const u=S.users.find(x=>x.user==$("#lu").value.trim()&&x.pass==$("#lp").value);
  if(!u)return $("#le").textContent="نام کاربری یا رمز عبور اشتباه است.";
  if(!u.on)return $("#le").textContent="حساب شما غیرفعال شده است. با مدیر تماس بگیرید.";
  me=u;tab="home";shell()};
}
function shell(){
 $("#app").innerHTML=`<header><label id="pfl" style="cursor:pointer;z-index:1">${avatar(me.id,40)}<input type="file" id="pf" accept="image/*" style="display:none"></label><h1 style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0">سامانه کنترل کیفیت</h1><span title="${DBSTATE=="ok"?"اتصال به حافظه‌ی مشترک برقرار است":DBSTATE=="error"?"اتصال برقرار نشد؛ فقط ذخیره‌ی محلی":"حالت آفلاین/محلی؛ اطلاعات مشترک نیست"}" style="z-index:1;width:10px;height:10px;border-radius:99px;background:${DBSTATE=="ok"?"#1f7a5a":"#b7791f"}"></span></header>
 <main id="v"></main>
 <div class="bottombar">
 <button class="${tab=="profile"?"on":""}" data-bt="profile" aria-label="پروفایل"><span class="ic">${avatar(me.id,26)}</span></button>
 <button class="${tab=="colleague"?"on":""}" data-bt="colleague" aria-label="گفتگو" style="position:relative"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4V5z"/></svg></span>${totalUnread()?`<span style="position:absolute;top:2px;left:2px;background:#c0392b;color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 3px">${totalUnread()}</span>`:""}</button>
 <button class="${tab=="home"?"on":""}" data-bt="home" aria-label="خانه"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg></span></button>
 <button class="${tab=="qcgram"?"on":""}" data-bt="qcgram" aria-label="QCgram"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M8 6l1.5-3h5L16 6"/><circle cx="12" cy="13" r="3.5"/></svg></span></button>
 <button id="bblo" aria-label="خروج"><span class="ic"><svg viewBox="0 0 24 24"><path d="M15 4H6v16h9"/><path d="M10 12h10m0 0l-3-3m3 3l-3 3"/></svg></span></button>
 </div>`;
 $("#bblo").onclick=()=>{me=null;login()};
 $("#pf").onchange=async()=>{const f=$("#pf").files[0];if(!f)return;const url=await uploadImage(f);me.photo=url;save();shell()};
 document.querySelectorAll(".bottombar [data-bt]").forEach(b=>b.onclick=()=>{tab=b.dataset.bt;shell()});
 ({home,qc,tasks,shift,qcgram,colleague,train,nc,admin,profile,announce,occasion,suggestions,complaints})[tab]();
}

function openModal(bodyHtml){
 closeModal();
 const bg=document.createElement("div");bg.className="modalbg";bg.id="modalbg";
 bg.innerHTML=`<div class="modalbox"><button class="modalclose" id="modalx">✕</button>${bodyHtml}</div>`;
 document.body.appendChild(bg);
 bg.onclick=(e)=>{if(e.target===bg)closeModal()};
 document.getElementById("modalx").onclick=closeModal;
}
function closeModal(){const b=document.getElementById("modalbg");if(b)b.remove()}

function home(){
 const la=S.announcement;
 const oc=S.occasion;
 $("#v").innerHTML=`<div class="menugrid">${TABS().map(t=>{const bn=t[0]=="suggestions"?suggUnread():t[0]=="complaints"?complaintsUnseen():0;
 return `<button data-t="${t[0]}"><span class="ic">${t[2]}</span>${t[1]}${bn?`<span style="position:absolute;top:2px;left:2px;background:#c0392b;color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 3px">${bn}</span>`:""}</button>`}).join("")}</div>
 <div class="card" id="anncard" style="cursor:pointer;margin-top:10px;padding:8px 14px"><h3 style="margin:0;font-size:13px">اعلانات</h3><p class="meta" style="margin:3px 0 0">${la?esc(la.text.slice(0,70)):"اعلانی ثبت نشده است"}</p></div>
 <div class="row" style="margin-top:8px;flex:1">
 <div class="card" id="gramcard" style="cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px"><div style="font-size:30px">📷</div><h3 style="margin:8px 0 0;font-size:14px">QCgram</h3></div>
 <div class="card" id="occcard" style="cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;overflow:hidden">${oc&&oc.image?`<img src="${oc.image}" style="width:100%;max-height:70%;object-fit:cover;border-radius:8px;margin-bottom:8px">`:'<div style="font-size:30px">🎉</div>'}<h3 style="margin:8px 0 0;font-size:14px">مناسبت‌ها</h3></div>
 </div>`;
 $("#anncard").onclick=()=>{tab="announce";shell()};
 $("#gramcard").onclick=()=>{tab="qcgram";shell()};
 $("#occcard").onclick=()=>{tab="occasion";shell()};
 document.querySelectorAll(".menugrid button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;shell()});
}
function announce(){
 const la=S.announcement;
 $("#v").innerHTML=`<div class="card"><h3>اعلانات</h3>${la?`<p>${esc(la.text)}</p><div class="meta">${esc(uname(la.by))} · ${fd(la.at,1)}</div>`:'<p class="meta">اعلانی ثبت نشده است.</p>'}</div>`;
}
function occasion(){
 const oc=S.occasion;
 if(!oc){$("#v").innerHTML='<div class="card"><p class="meta">مناسبتی ثبت نشده است.</p></div>';return}
 const liked=(oc.likes||[]).includes(me.id);
 $("#v").innerHTML=`<div class="card">
 ${oc.image?`<img src="${oc.image}" style="width:100%;border-radius:8px;margin-bottom:8px;max-height:320px;object-fit:cover">`:""}
 <p>${esc(oc.caption)}</p>
 <div class="meta">${esc(uname(oc.by))} · ${fd(oc.at,1)}</div>
 <button class="btn sm ${liked?"":"alt"}" id="oclike">${liked?"❤️ پسندیدم":"🤍 پسندیدن"} (${(oc.likes||[]).length})</button>
 <div style="margin-top:12px">${(oc.comments||[]).map(c=>`<div style="margin-top:8px;display:flex;gap:8px">${avatar(c.by)}<div><b style="font-size:13px">${esc(uname(c.by))}</b> <span style="font-size:13px">${esc(c.text)}</span><div class="meta">${fd(c.at,1)}</div></div></div>`).join("")}</div>
 <div class="row" style="margin-top:10px">${["👍","❤️","😂","🎉","👏","🔥"].map(e=>`<button class="btn sm alt" data-emo="${e}" style="flex:0 0 auto;padding:6px 10px">${e}</button>`).join("")}</div>
 <div class="row"><input id="occm" placeholder="نظر شما..."><button class="btn sm" id="occb">ارسال</button></div>
 </div>`;
 $("#oclike").onclick=()=>{oc.likes=oc.likes||[];const i=oc.likes.indexOf(me.id);if(i>-1)oc.likes.splice(i,1);else oc.likes.push(me.id);save();occasion()};
 document.querySelectorAll("[data-emo]").forEach(b=>b.onclick=()=>{$("#occm").value+=b.dataset.emo});
 $("#occb").onclick=()=>{const t=$("#occm").value.trim();if(!t)return;oc.comments=oc.comments||[];oc.comments.push({id:nid(),by:me.id,text:t,at:Date.now()});save();occasion()};
}

function qc(){
 const term=q.trim();
 const hits=term?S.qc.filter(r=>[r.c,r.p,r.o].some(f=>f&&f.includes(term))):[];
 $("#v").innerHTML=`<div class="card"><h3>جستجو</h3><div class="row"><input id="qs" placeholder="نام مشتری، نام محصول یا شماره سفارش (یا بخشی از آن)" value="${esc(q)}">${can("qc")?`<button class="btn sm" id="qnew" style="flex:0 0 auto">+ ثبت جدید</button>`:""}</div>
 ${term?(hits.length?hits.slice().reverse().map(r=>`<div class="card"><b>${esc(r.c)}</b> ${r.p?`<span class="tag">${esc(r.p)}</span>`:""} ${r.o?`<span class="tag">سفارش ${esc(r.o)}</span>`:""}<p>${esc(r.t)}</p><div class="meta">${esc(uname(r.by))} · ${fd(r.at,1)}</div></div>`).join(""):'<p class="meta">موردی پیدا نشد.</p>'):'<p class="meta">با نوشتن در کادر بالا، همه اطلاعات ثبت‌شده نمایش داده می‌شود.</p>'}</div>`;
 const qs=$("#qs");qs.oninput=()=>{q=qs.value;qc();const n=$("#qs");n.focus();n.setSelectionRange(q.length,q.length)};
 if(can("qc"))$("#qnew").onclick=()=>openQcModal();
}
function openQcModal(){
 openModal(`<h3>ثبت اطلاعات کیفی جدید</h3><select id="mfc"><option value="">مشتری را انتخاب کنید (الزامی)</option>${S.customers.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}<option value="__new">+ مشتری جدید…</option></select><input id="mfcn" placeholder="نام مشتری جدید" style="display:none"><input id="mfp" placeholder="محصول (اختیاری)"><input id="mfo" placeholder="سفارش (اختیاری)"><textarea id="mft" rows="3" placeholder="اطلاعات"></textarea><div class="err" id="mfe"></div><button class="btn" id="mfb">ثبت</button>`);
 $("#mfc").onchange=()=>{$("#mfcn").style.display=$("#mfc").value=="__new"?"":"none"};
 $("#mfb").onclick=()=>{let c=$("#mfc").value;const t=$("#mft").value.trim();
  if(c=="__new"){c=$("#mfcn").value.trim();if(!c)return $("#mfe").textContent="نام مشتری جدید را وارد کنید.";
   if(!S.customers.includes(c))S.customers.push(c)}
  if(!c)return $("#mfe").textContent="یک مشتری از فهرست انتخاب کنید.";
  S.qc.push({c,p:$("#mfp").value.trim(),o:$("#mfo").value.trim(),t,by:me.id,at:Date.now()});save();closeModal();qc()};
}

function tasks(){
 const st={open:["در انتظار انجام","wa"],wait:["در انتظار تأیید نهایی","wa"],done:["بسته شد","ok"]};
 const mine=S.tasks.filter(t=>t.to==me.id||t.by==me.id).slice().sort((a,b)=>(a.s=="done")-(b.s=="done")||b.at-a.at);
 $("#v").innerHTML=`<div class="row" style="align-items:center"><h3 style="flex:1;margin:0">کارها و وظایف</h3><button class="btn sm" id="tnew" style="flex:0 0 auto">+ وظیفه جدید</button></div>

const JMONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
function persianParts(d){
 const f=new Intl.DateTimeFormat("en-US-u-ca-persian",{year:"numeric",month:"numeric",day:"numeric"});
 const o={};f.formatToParts(d).forEach(x=>o[x.type]=x.value);
 return {y:+o.year,m:+o.month,d:+o.day};
}
function jalaliToDate(jy,jm,jd){
 let est=new Date(Date.UTC(jy+621,2,20));
 est.setUTCDate(est.getUTCDate()+(jm-1)*30+(jd-1));
 for(let off=-6;off<=6;off++){const c=new Date(est.getTime()+off*86400000);const pp=persianParts(c);if(pp.y==jy&&pp.m==jm&&pp.d==jd)return c}
 return est;
}
function daysInJalaliMonth(jy,jm){for(let d=31;d>=29;d--){const pp=persianParts(jalaliToDate(jy,jm,d));if(pp.y==jy&&pp.m==jm&&pp.d==d)return d}return 29}
function isoFromJalali(jy,jm,jd){const dt=jalaliToDate(jy,jm,jd);return dt.getUTCFullYear()+"-"+String(dt.getUTCMonth()+1).padStart(2,"0")+"-"+String(dt.getUTCDate()).padStart(2,"0")}

function shift(){
 const g={};S.shifts.forEach(s=>{(g[s.date+"|"+s.sh]=g[s.date+"|"+s.sh]||[]).push(s)});
 const keys=Object.keys(g).sort().reverse();
 $("#v").innerHTML=`<div class="row" style="align-items:center"><h3 style="flex:1;margin:0">تحویل شیفت‌ها</h3>${can("shift")?`<button class="btn sm" id="shnew" style="flex:0 0 auto">+ ثبت جدید</button>`:""}</div>
 ${keys.length?keys.map(k=>{const [d,sh]=k.split("|");return `<div class="paper"><h4>${fd(d)} — شیفت ${sh}</h4>${g[k].map(s=>`<div>• ${esc(s.t)} (${esc(uname(s.by))})</div>`).join("")}</div>`}).join(""):'<p class="meta">هنوز مطلبی ثبت نشده است.</p>'}`;
 if(can("shift"))$("#shnew").onclick=()=>openShiftModal();
}
function openShiftModal(){
 const todayP=persianParts(new Date());
 if(window.__shY==null){window.__shY=todayP.y;window.__shM=todayP.m;window.__shD=todayP.d}
 const yrs=[];for(let y=todayP.y-3;y<=todayP.y+1;y++)yrs.push(y);
 function render(){
  const dim=daysInJalaliMonth(window.__shY,window.__shM);
  if(window.__shD>dim)window.__shD=dim;
  return `<h3>ثبت تحویل شیفت</h3><div class="row">
 <select id="mshd">${Array.from({length:dim},(_,i)=>i+1).map(d=>`<option value="${d}" ${d==window.__shD?"selected":""}>${d}</option>`).join("")}</select>
 <select id="mshm">${JMONTHS.map((mn,i)=>`<option value="${i+1}" ${i+1==window.__shM?"selected":""}>${mn}</option>`).join("")}</select>
 <select id="mshy">${yrs.map(y=>`<option value="${y}" ${y==window.__shY?"selected":""}>${y}</option>`).join("")}</select>
 <select id="mss"><option value="روز">شیفت روز</option><option value="شب">شیفت شب</option></select></div>
 <textarea id="mst" rows="3" placeholder="مطالب مهم شیفت"></textarea><button class="btn" id="msb">ثبت</button>`;
 }
 function wire(){
  $("#mshy").onchange=()=>{window.__shY=+$("#mshy").value;openModal(render());wire()};
  $("#mshm").onchange=()=>{window.__shM=+$("#mshm").value;openModal(render());wire()};
  $("#mshd").onchange=()=>{window.__shD=+$("#mshd").value};
  $("#msb").onclick=()=>{const t=$("#mst").value.trim();if(!t)return;
   const iso=isoFromJalali(window.__shY,window.__shM,window.__shD);
   S.shifts.push({date:iso,sh:$("#mss").value,t,by:me.id});save();closeModal();shift()};
 }
 openModal(render());wire();
}

 ${p.images.length?`<div style="display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:8px">${p.images.map(im=>`<img src="${im}" style="scroll-snap-align:start;width:85%;flex:0 0 auto;max-height:260px;object-fit:cover;border-radius:8px">`).join("")}</div>`:""}
 <p>${esc(p.caption)}</p>
 <div class="meta">${p.comments.filter(c=>!c.parent).length} دیدگاه</div>
 ${p.comments.filter(c=>!c.parent).map(c=>`<div style="margin-top:8px;display:flex;gap:8px">${avatar(c.by)}<div><b style="font-size:13px">${esc(uname(c.by))}</b> <span style="font-size:13px">${esc(c.text)}</span><div class="meta">${fd(c.at,1)} · <a href="#" data-reply="${p.id}:${c.id}" style="color:var(--navy,#04123f)">پاسخ</a></div>
 ${p.comments.filter(r=>r.parent==c.id).map(r=>`<div style="margin-top:6px;display:flex;gap:6px">${avatar(r.by)}<div><b style="font-size:12px">${esc(uname(r.by))}</b> <span style="font-size:12px">${esc(r.text)}</span></div></div>`).join("")}
 </div></div>`).join("")}
 <div class="row" style="margin-top:10px"><input placeholder="نظر شما..." data-cm="${p.id}"><button class="btn sm" data-cb="${p.id}">ارسال</button></div>
 </div>`).join(""):'<p class="meta">هنوز پستی منتشر نشده است.</p>'}`;
 let replyTo=null;
 document.querySelectorAll("[data-reply]").forEach(a=>a.onclick=(e)=>{e.preventDefault();const [pid,cid]=a.dataset.reply.split(":");replyTo=cid;const inp=document.querySelector(`[data-cm="${pid}"]`);inp.placeholder="در پاسخ...";inp.focus()});
 document.querySelectorAll("[data-cb]").forEach(b=>b.onclick=()=>{const pid=+b.dataset.cb;const inp=document.querySelector(`[data-cm="${pid}"]`);const t=inp.value.trim();if(!t)return;
  const p=S.posts.find(x=>x.id==pid);p.comments.push({id:nid(),by:me.id,text:t,at:Date.now(),parent:replyTo});replyTo=null;save();qcgram()});
}

function readKey(gid){return gid+":"+me.id}
function groupUnread(gid){const lr=S.reads[readKey(gid)]||0;return S.gmsgs.filter(m=>m.groupId==gid&&m.from!=me.id&&m.at>lr).length}
function totalUnread(){return S.groups.filter(g=>g.members.includes(me.id)).reduce((s,g)=>s+groupUnread(g.id),0)}
function markRead(gid){S.reads[readKey(gid)]=Date.now();save()}
function colleague(){
 const gid=window.__openGroup;
 if(gid)return groupChat(gid);
 const mine=S.groups.filter(g=>g.members.includes(me.id)).slice().reverse();
 $("#v").innerHTML=`<div class="row" style="align-items:center"><h3 style="flex:1;margin:0">گروه‌های گفتگو</h3>${can("group")?`<button class="btn sm" id="gnew" style="flex:0 0 auto">+ گروه جدید</button>`:""}</div>
 ${mine.length?mine.map(g=>{const un=groupUnread(g.id);const last=S.gmsgs.filter(m=>m.groupId==g.id).slice(-1)[0];
 return `<div class="card" data-og="${g.id}" style="cursor:pointer;display:flex;align-items:center;gap:10px">
 <div style="flex:1"><b>${esc(g.name)}</b><div class="meta">${last?esc((last.text||"📷 تصویر").slice(0,50)):"هنوز پیامی نیست"}</div></div>
 ${un?`<span class="tag wa" style="border-radius:99px">${un}</span>`:""}
 </div>`}).join(""):'<p class="meta">هنوز عضو هیچ گروهی نیستید.</p>'}`;
 document.querySelectorAll("[data-og]").forEach(c=>c.onclick=()=>{window.__openGroup=+c.dataset.og;markRead(+c.dataset.og);colleague()});
 const nb=document.getElementById("gnew");if(nb)nb.onclick=()=>openGroupModal();
}
function openGroupModal(){
 const others=S.users.filter(u=>u.on);
 openModal(`<h3>گروه جدید</h3><input id="mgn" placeholder="نام گروه"><p class="meta">اعضا را انتخاب کنید:</p>
 <div style="max-height:200px;overflow-y:auto">${others.map(u=>`<label style="display:block;margin-bottom:6px"><input type="checkbox" value="${u.id}" data-gm style="width:auto;margin-left:6px">${esc(u.name)}</label>`).join("")}</div>
 <div class="err" id="mge"></div><button class="btn sm" id="mgb">ایجاد گروه</button>`);
 $("#mgb").onclick=()=>{const name=$("#mgn").value.trim();const members=[...document.querySelectorAll("[data-gm]:checked")].map(c=>+c.value);
  if(!name)return $("#mge").textContent="نام گروه را وارد کنید.";
  if(!members.includes(me.id))members.push(me.id);
  if(members.length<2)return $("#mge").textContent="حداقل یک عضو دیگر انتخاب کنید.";
  S.groups.push({id:nid(),name,members,createdBy:me.id,at:Date.now()});save();closeModal();colleague()};
}
function groupChat(gid){
 const g=S.groups.find(x=>x.id==gid);
 if(!g){window.__openGroup=null;return colleague()}
 markRead(gid);
 const msgs=S.gmsgs.filter(m=>m.groupId==gid).sort((a,b)=>a.at-b.at);
 const M=id=>S.gmsgs.find(x=>x.id==id);
 $("#v").innerHTML=`<div class="row" style="align-items:center"><button class="btn sm alt" id="gback" style="flex:0 0 auto">→ بازگشت</button><h3 style="flex:1;margin:0">${esc(g.name)}</h3></div>
 <div class="card" style="max-height:50vh;overflow-y:auto" id="gmsgbox">${msgs.length?msgs.map(m=>{const rp=m.parent?M(m.parent):null;
 return `<div style="margin-bottom:10px;display:flex;gap:8px">${avatar(m.from)}<div style="flex:1">
 <b style="font-size:13px">${esc(uname(m.from))}</b>
 ${rp?`<div class="meta" style="border-inline-start:2px solid var(--gold);padding-inline-start:6px">${esc(uname(rp.from))}: ${esc((rp.text||"تصویر").slice(0,40))}</div>`:""}
 ${m.image?`<img src="${m.image}" style="max-width:60%;border-radius:8px;margin:4px 0;display:block">`:""}
 ${m.text?`<div>${esc(m.text)}</div>`:""}
 <div class="meta">${fd(m.at,1)} · <a href="#" data-reply="${m.id}" style="color:var(--navy,#04123f)">پاسخ</a></div>
 </div></div>`}).join(""):'<p class="meta">هنوز پیامی نیست.</p>'}</div>
 <div class="meta" id="greplybox" style="display:none;margin-top:8px"></div>
 <div class="row" style="margin-top:8px">${["👍","❤️","😂","🎉","🙏","🔥"].map(e=>`<button class="btn sm alt" data-emo="${e}" style="flex:0 0 auto;padding:6px 10px">${e}</button>`).join("")}</div>
 <div id="gsug" style="display:none;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:6px;overflow:hidden"></div>
 <div class="row"><input id="gtxt" placeholder="پیام... (برای منشن از @ استفاده کنید)"><label class="btn sm alt" style="flex:0 0 auto;cursor:pointer">📎<input type="file" id="gimg" accept="image/*" style="display:none"></label><label class="btn sm alt" style="flex:0 0 auto;cursor:pointer">📷<input type="file" id="gcam" accept="image/*" capture="environment" style="display:none"></label><button class="btn sm" id="gsend" style="flex:0 0 auto">ارسال</button></div>`;
 const box=$("#gmsgbox");box.scrollTop=box.scrollHeight;
 $("#gback").onclick=()=>{window.__openGroup=null;colleague()};
 let replyTo=null;
 document.querySelectorAll("[data-reply]").forEach(a=>a.onclick=(e)=>{e.preventDefault();replyTo=+a.dataset.reply;const rm=M(replyTo);
  $("#greplybox").style.display="block";$("#greplybox").innerHTML=`در پاسخ به ${esc(uname(rm.from))}: ${esc((rm.text||"تصویر").slice(0,40))} <a href="#" id="gcancelreply">✕</a>`;
  document.getElementById("gcancelreply").onclick=(ev)=>{ev.preventDefault();replyTo=null;$("#greplybox").style.display="none"};
  $("#gtxt").focus()});
 document.querySelectorAll("[data-emo]").forEach(b=>b.onclick=()=>{$("#gtxt").value+=b.dataset.emo});
 const memberNames=g.members.filter(id=>id!=me.id).map(id=>uname(id));
 $("#gtxt").oninput=()=>{
  const v=$("#gtxt").value;
  const m=v.match(/@([^\s@]*)$/);
  const sug=$("#gsug");
  if(!m){sug.style.display="none";sug.innerHTML="";return}
  const partial=m[1];
  const matches=memberNames.filter(n=>n.includes(partial));
  if(!matches.length){sug.style.display="none";sug.innerHTML="";return}
  sug.style.display="block";
  sug.innerHTML=matches.map(n=>`<div data-mn="${esc(n)}" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)">@${esc(n)}</div>`).join("");
  sug.querySelectorAll("[data-mn]").forEach(el=>el.onclick=()=>{
   $("#gtxt").value=v.slice(0,m.index)+"@"+el.dataset.mn+" ";
   sug.style.display="none";sug.innerHTML="";$("#gtxt").focus();
  });
 };
 async function sendWith(image){
  const t=$("#gtxt").value.trim();if(!t&&!image)return;
  S.gmsgs.push({id:nid(),groupId:gid,from:me.id,text:t,image:image||null,at:Date.now(),parent:replyTo});
  replyTo=null;markRead(gid);save();groupChat(gid);
 }
 $("#gsend").onclick=()=>sendWith(null);
 $("#gimg").onchange=async()=>{const f=$("#gimg").files[0];if(!f)return;const url=await uploadImage(f);sendWith(url)};
 $("#gcam").onchange=async()=>{const f=$("#gcam").files[0];if(!f)return;const url=await uploadImage(f);sendWith(url)};
}

function train(){
 $("#v").innerHTML=`<div class="row" style="align-items:center"><h3 style="flex:1;margin:0">آموزش‌ها</h3>${can("train")?`<button class="btn sm" id="trnew" style="flex:0 0 auto">+ ثبت آموزش جدید</button>`:""}</div>
 ${S.trainings.length?`<div class="bookgrid">${S.trainings.map(t=>`<div class="bookcard" data-op="${t.id}"><div class="bicon">📘</div><div class="btitle">${esc(t.title)}</div></div>`).join("")}</div>`:'<p class="meta">هنوز مطلبی ثبت نشده است.</p>'}`;
 if(can("train"))$("#trnew").onclick=()=>openTrainModal();
 document.querySelectorAll("[data-op]").forEach(b=>b.onclick=()=>{const t=S.trainings.find(x=>x.id==b.dataset.op);if(!t)return;
  const media=t.image?(t.kind=="pdf"?`<p><a href="${t.image}" target="_blank" class="tag">📄 مشاهده فایل پی‌دی‌اف</a></p>`:`<img src="${t.image}" style="width:100%;border-radius:8px;margin-bottom:8px">`):"";
  openModal(`<h3>${esc(t.title)}</h3>${media}<p>${esc(t.text)}</p><div class="meta">${esc(uname(t.by))} · ${fd(t.at,1)}</div>`)});
}
function openTrainModal(){
 openModal(`<h3>مطلب آموزشی جدید</h3><input id="mtrt" placeholder="عنوان"><textarea id="mtrx" rows="3" placeholder="متن آموزشی"></textarea><input type="file" id="mtri" accept="image/*,application/pdf,.pdf"><div class="err" id="mtre"></div><button class="btn sm" id="mtrb">ثبت</button>`);
 $("#mtrb").onclick=async()=>{const ti=$("#mtrt").value.trim(),tx=$("#mtrx").value.trim();if(!ti||!tx)return $("#mtre").textContent="عنوان و متن را وارد کنید.";
  const f=$("#mtri").files[0];const image=f?await uploadImage(f):null;const kind=f&&(f.type=="application/pdf"||f.name.toLowerCase().endsWith(".pdf"))?"pdf":"image";
  S.trainings.push({id:nid(),title:ti,text:tx,image,kind,by:me.id,at:Date.now()});save();closeModal();train()};
}

function nc(){
 const CAUSE={human:"نیروی انسانی",method:"روش کار"};
 const mine=S.nc.filter(n=>me.role=="manager"||n.to[0]==me.id||n.holder==me.id).slice().sort((a,b)=>(a.status=="closed")-(b.status=="closed")||b.at-a.at);
 const others=S.users.filter(u=>u.on&&u.id!=me.id);
 $("#v").innerHTML=`<div class="row" style="align-items:center"><h3 style="flex:1;margin:0">عدم انطباق‌ها</h3>${me.role=="manager"?`<button class="btn sm" id="ncnew" style="flex:0 0 auto">+ ثبت جدید</button>`:""}</div>
 ${mine.length?mine.map(n=>{
 const closed=n.status=="closed";const mineHold=n.holder==me.id;
 return `<div class="card">${!closed?`<span class="tag wa">باز</span> `:""}<b>${esc(n.subject)}</b> <span class="tag ${closed?"ok":"wa"}">${closed?"بسته":n.status=="awaiting_manager"?"در انتظار تأیید مدیر":"در جریان"}</span>
 <p class="meta">دست: ${esc(uname(n.holder))} · گردش: ${n.to.map(uname).join(" ← ")}</p>
 <p>${esc(n.desc)}</p>
 <div class="meta">${n.trail.map(h=>`${esc(uname(h.by))}: ${esc(h.note||h.type)} (${fd(h.at,1)})`).join("<br>")}</div>
 ${n.cause?`<p class="meta">عامل: ${CAUSE[n.cause]||""} ${n.offenders&&n.offenders.length?"· افراد: "+n.offenders.map(uname).join("، "):""}${n.corrective?"<br>اقدام اصلاحی: "+esc(n.corrective):""}</p>`:""}
 ${!closed&&mineHold&&me.id!=n.to[0]?`<div class="row"><select data-fwd="${n.id}"><option value="">ارسال به...</option>${S.users.filter(u=>u.on&&u.id!=n.holder).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select><input placeholder="یادداشت" data-fnote="${n.id}"></div><button class="btn sm" data-fb="${n.id}">ارسال به نفر بعد</button>`:""}
 ${!closed&&mineHold&&me.id==n.to[0]&&n.status=="in_progress"?`<div class="card"><select data-cause="${n.id}"><option value="">عامل را انتخاب کنید</option><option value="human">نیروی انسانی</option><option value="method">روش کار</option></select><select multiple data-off="${n.id}" style="min-height:70px">${S.users.filter(u=>u.on).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select><textarea data-corr="${n.id}" rows="2" placeholder="اقدام اصلاحی"></textarea><button class="btn sm" data-concl="${n.id}">ثبت نتیجه‌گیری و ارسال برای تأیید مدیر</button></div>`:""}
 ${!closed&&me.role=="manager"&&n.status=="awaiting_manager"?`<button class="btn sm" data-appr="${n.id}">تأیید و بستن</button> <button class="btn sm alt" data-rej="${n.id}">رد و بازگشت</button>`:""}
 ${!closed&&(me.role=="manager"||me.id==n.to[0])&&n.holder!=me.id?`<button class="btn sm alt" data-pull="${n.id}">بازپس‌گیری با یادداشت</button>`:""}
 </div>`}).join(""):'<p class="meta">موردی برای نمایش نیست.</p>'}
 ${me.role=="manager"?ncReport():""}`;
 if(me.role=="manager")$("#ncnew").onclick=()=>openNcModal(others);
 const N=id=>S.nc.find(x=>x.id==id);
 document.querySelectorAll("[data-fb]").forEach(b=>b.onclick=()=>{const n=N(+b.dataset.fb);const to=+document.querySelector(`[data-fwd="${n.id}"]`).value;if(!to)return;
  const note=document.querySelector(`[data-fnote="${n.id}"]`).value.trim();n.to.push(to);n.holder=to;n.trail.push({by:me.id,type:"ارجاع",note,at:Date.now()});save();nc()});
 document.querySelectorAll("[data-concl]").forEach(b=>b.onclick=()=>{const n=N(+b.dataset.concl);const cause=document.querySelector(`[data-cause="${n.id}"]`).value;
  const offs=[...document.querySelector(`[data-off="${n.id}"]`).selectedOptions].map(o=>+o.value);const corr=document.querySelector(`[data-corr="${n.id}"]`).value.trim();
  if(!cause||!corr)return;n.cause=cause;n.offenders=cause=="human"?offs:[];n.corrective=corr;n.status="awaiting_manager";n.holder=n.by;n.trail.push({by:me.id,type:"نتیجه‌گیری",note:corr,at:Date.now()});save();nc()});
 document.querySelectorAll("[data-appr]").forEach(b=>b.onclick=()=>{const n=N(+b.dataset.appr);n.status="closed";n.trail.push({by:me.id,type:"تأیید و بستن",at:Date.now()});save();nc()});
 document.querySelectorAll("[data-rej]").forEach(b=>b.onclick=()=>{const n=N(+b.dataset.rej);n.status="in_progress";n.holder=n.to[0];n.trail.push({by:me.id,type:"رد شد",note:"بازگشت برای اصلاح",at:Date.now()});save();nc()});
 document.querySelectorAll("[data-pull]").forEach(b=>b.onclick=()=>{const n=N(+b.dataset.pull);n.holder=me.id;n.status="in_progress";n.trail.push({by:me.id,type:"بازپس‌گیری",at:Date.now()});save();nc()});
}
function openNcModal(others){
 openModal(`<h3>ثبت عدم انطباق جدید</h3><input id="mns" placeholder="موضوع"><textarea id="mnd" rows="2" placeholder="شرح"></textarea><select id="mnto">${others.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select><div class="err" id="mne"></div><button class="btn sm" id="mnb">ارسال</button>`);
 $("#mnb").onclick=()=>{const su=$("#mns").value.trim(),de=$("#mnd").value.trim(),to=+$("#mnto").value;
  if(!su||!de)return $("#mne").textContent="موضوع و شرح را وارد کنید.";
  S.nc.push({id:nid(),subject:su,desc:de,by:me.id,at:Date.now(),to:[to],holder:to,status:"in_progress",cause:"",offenders:[],corrective:"",trail:[{by:me.id,type:"ایجاد",note:de,at:Date.now()}]});save();closeModal();nc()};
}
function suggUnread(){
 if(me.role=="manager")return S.suggestions.filter(s=>s.by!=me.id&&s.at>(S.suggReads[me.id]||0)).length;
 return S.suggestions.filter(s=>s.by==me.id&&s.reply&&s.replyAt>(S.suggReads[me.id]||0)).length;
}
function complaintsUnseen(){return S.complaints.filter(c=>!S.complaintSeen[c.id+":"+me.id]).length}
function suggestions(){
 S.suggReads[me.id]=Date.now();save();
 if(me.role=="manager"){
  const list=S.suggestions.slice().reverse();
  $("#v").innerHTML=`<h3>صندوق انتقادات و پیشنهادات</h3>
  ${list.length?list.map(s=>`<div class="card">${!s.reply?'<span class="tag wa">بدون پاسخ</span>':'<span class="tag ok">پاسخ داده شده</span>'}
  <p>${esc(s.text)}</p><div class="meta">${esc(uname(s.by))} · ${fd(s.at,1)}</div>
  ${s.reply?`<div class="card"><b>پاسخ:</b> ${esc(s.reply)}<div class="meta">${fd(s.replyAt,1)}</div></div>`:`<textarea data-sr="${s.id}" rows="2" placeholder="پاسخ شما"></textarea><button class="btn sm" data-sb="${s.id}">ارسال پاسخ</button>`}
  </div>`).join(""):'<p class="meta">موردی ثبت نشده است.</p>'}`;
  document.querySelectorAll("[data-sb]").forEach(b=>b.onclick=()=>{const id=+b.dataset.sb;const s=S.suggestions.find(x=>x.id==id);
   const r=document.querySelector(`[data-sr="${id}"]`).value.trim();if(!r)return;s.reply=r;s.replyAt=Date.now();save();suggestions()});
 }else{
  const mine=S.suggestions.filter(s=>s.by==me.id).slice().reverse();
  $("#v").innerHTML=`<div class="card"><h3>ارسال انتقاد یا پیشنهاد</h3><textarea id="sgt" rows="3" placeholder="متن خود را بنویسید"></textarea><button class="btn sm" id="sgb">ارسال</button></div>
  ${mine.length?`<h3>موارد ارسالی شما</h3>${mine.map(s=>`<div class="card">${!s.reply?'<span class="tag wa">بدون پاسخ</span>':'<span class="tag ok">پاسخ داده شده</span>'}<p>${esc(s.text)}</p><div class="meta">${fd(s.at,1)}</div>${s.reply?`<div class="card"><b>پاسخ مدیریت:</b> ${esc(s.reply)}</div>`:""}</div>`).join("")}`:""}`;
  $("#sgb").onclick=()=>{const t=$("#sgt").value.trim();if(!t)return;S.suggestions.push({id:nid(),by:me.id,text:t,at:Date.now(),reply:null,replyAt:null});save();suggestions()};
 }
}

 const openId=window.__openComplaint;
 if(openId){
  const c=S.complaints.find(x=>x.id==openId);
  if(c){
   S.complaintSeen[c.id+":"+me.id]=true;save();
   $("#v").innerHTML=`<button class="btn sm alt" id="cxback" style="margin-bottom:12px">→ بازگشت</button>
   <div class="card"><h3>${esc(c.subject)}</h3><p>${esc(c.text)}</p>
   ${c.images&&c.images.length?`<div style="display:flex;gap:6px;overflow-x:auto">${c.images.map(im=>`<img src="${im}" style="width:70%;flex:0 0 auto;max-height:220px;object-fit:cover;border-radius:8px">`).join("")}</div>`:""}
   <div class="meta">${esc(uname(c.by))} · ${fd(c.at,1)}</div></div>`;
   $("#cxback").onclick=()=>{window.__openComplaint=null;complaints()};
   return;
  }
  window.__openComplaint=null;
 }
 const list=S.complaints.slice().reverse();
 $("#v").innerHTML=`<div class="row" style="align-items:center"><h3 style="flex:1;margin:0">شکایات</h3>${can("complaint")?`<button class="btn sm" id="cxnew" style="flex:0 0 auto">+ افزودن شکایت</button>`:""}</div>
 ${list.length?list.map(c=>`<div class="card" data-oc="${c.id}" style="cursor:pointer">${!S.complaintSeen[c.id+":"+me.id]?'<span class="tag wa">جدید</span> ':""}<b>${esc(c.subject)}</b><div class="meta">${esc(uname(c.by))} · ${fd(c.at,1)}</div></div>`).join(""):'<p class="meta">شکایتی ثبت نشده است.</p>'}`;
 document.querySelectorAll("[data-oc]").forEach(d=>d.onclick=()=>{window.__openComplaint=+d.dataset.oc;complaints()});
 const nb=document.getElementById("cxnew");if(nb)nb.onclick=()=>openComplaintModal();
}
function openComplaintModal(){
 openModal(`<h3>ثبت شکایت جدید</h3><input id="mcs" placeholder="موضوع"><textarea id="mct" rows="3" placeholder="متن شکایت"></textarea><input type="file" id="mci" accept="image/*" multiple><div class="err" id="mce"></div><button class="btn sm" id="mcb">ثبت</button>`);
 $("#mcb").onclick=async()=>{const su=$("#mcs").value.trim(),tx=$("#mct").value.trim();if(!su||!tx)return $("#mce").textContent="موضوع و متن را وارد کنید.";
  const files=[...$("#mci").files];const images=files.length?await Promise.all(files.map(uploadImage)):[];
  S.complaints.push({id:nid(),by:me.id,subject:su,text:tx,images,at:Date.now()});save();closeModal();complaints()};
}
function ncReport(){
 const off={},cau={human:0,method:0};let open=0,closed=0;
 S.nc.forEach(n=>{n.status=="closed"?closed++:open++;if(n.cause)cau[n.cause]++;(n.offenders||[]).forEach(o=>off[o]=(off[o]||0)+1)});
 return `<div class="card"><h3>گزارش عدم انطباق‌ها</h3><p>باز: ${open} · بسته: ${closed}</p><p>نیروی انسانی: ${cau.human} · روش کار: ${cau.method}</p>
 ${Object.keys(off).length?`<p>افراد خاطی:<br>${Object.entries(off).map(([id,c])=>`${esc(uname(id))}: ${c}`).join("<br>")}</p>`:""}</div>`;
}


boot();
</script>
