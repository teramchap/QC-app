<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اصلاح ارسال عکس در گفتگو</title>
<style>
body{font-family:Tahoma,Vazirmatn,sans-serif;background:#f3f4f6;margin:0;padding:20px;line-height:1.9;color:#222}
.box{max-width:640px;margin:0 auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.1)}
h2{margin-top:0}
button,input[type=file]{font:inherit}
.btn{background:#d91c2e;color:#fff;border:0;padding:10px 22px;border-radius:8px;cursor:pointer;margin-top:10px}
.btn:disabled{opacity:.5}
.row{padding:6px 0;border-bottom:1px solid #eee;font-size:14px}
.ok{color:#1f7a5a}.skip{color:#6b6f76}.bad{color:#d91c2e;font-weight:700}
#res{margin-top:14px}
</style>
</head>
<body>
<div class="box">
<h2>اصلاح ارسال عکس در گفتگو</h2>
<p>۱) فایل <b>index.html</b> فعلی (همان که آخرین بار آپلود کردید) را انتخاب کنید.<br>۲) دکمه‌ی «اعمال تغییرات» را بزنید.<br>۳) فایل جدید را جای قبلی در GitHub آپلود کنید.</p>
<input type="file" id="f" accept=".html,text/html">
<div><button class="btn" id="go" disabled>اعمال تغییرات</button></div>
<div id="res"></div>
</div>

<script type="text/plain" id="f1">
\}catch\(e\)\{\}\}\s*return await fileToDataURL\(f\);
</script>
<script type="text/plain" id="r1">
}catch(e){toast("آپلود عکس ناموفق بود؛ اینترنت را بررسی کنید و دوباره بفرستید");throw e}}
 return await fileToDataURL(f);
</script>

<script type="text/plain" id="f2">
$("#gimg").files[0];if(!f)return;const url=await uploadImage(f);
</script>
<script type="text/plain" id="r2">
$("#gimg").files[0];if(!f)return;const url=await uploadImage(f,{compress:true});
</script>

<script type="text/plain" id="f3">
$("#gcam").files[0];if(!f)return;const url=await uploadImage(f);
</script>
<script type="text/plain" id="r3">
$("#gcam").files[0];if(!f)return;const url=await uploadImage(f,{compress:true});
</script>

<script type="text/plain" id="f4">
const QC_BUILD="[^"]*";
</script>
<script type="text/plain" id="r4">
const QC_BUILD="2026-10-24 12:00 UTC";
</script>

<script>
const CFG=[
 {n:"عدم ذخیره‌ی عکس داخل خود پیام (در صورت شکست آپلود، خطا نشان بده)",f:"f1",r:"r1",re:1},
 {n:"کوچک‌سازی عکس‌های گالری در گفتگو",f:"f2",r:"r2"},
 {n:"کوچک‌سازی عکس‌های دوربین در گفتگو",f:"f3",r:"r3"},
 {n:"شماره‌ی نسخه",f:"f4",r:"r4",re:1}
];
const g=id=>{let t=document.getElementById(id).textContent;if(t[0]==="\n")t=t.slice(1);if(t.endsWith("\n"))t=t.slice(0,-1);return t};
function applyAll(src){
 const out=[];let ok=true;
 for(const c of CFG){
  const f=g(c.f),r=g(c.r);
  if(src.includes(r)){out.push([c.n,"skip","قبلاً اعمال شده بود"]);continue}
  const count=c.re?(src.match(new RegExp(f,"g"))||[]).length:src.split(f).length-1;
  if(count===1){src=c.re?src.replace(new RegExp(f),()=>r):src.replace(f,()=>r);out.push([c.n,"ok","اعمال شد"])}
  else{ok=false;out.push([c.n,"bad",count===0?"محل مورد نظر در فایل پیدا نشد":"این بخش چند جا پیدا شد"])}
 }
 return {src,out,ok};
}
const fi=document.getElementById("f"),go=document.getElementById("go"),res=document.getElementById("res");
fi.onchange=()=>{go.disabled=!fi.files.length;res.innerHTML=""};
go.onclick=async()=>{
 const file=fi.files[0];if(!file)return;
 const text=await file.text();
 if(text.indexOf("QC_BUILD")<0){res.innerHTML='<p class="bad">این فایل، فایل سامانه کنترل کیفیت نیست.</p>';return}
 const {src,out,ok}=applyAll(text);
 const cls={ok:"ok",skip:"skip",bad:"bad"};
 res.innerHTML=out.map(o=>`<div class="row ${cls[o[1]]}">${o[1]==="bad"?"✗":o[1]==="ok"?"✓":"•"} ${o[0]} — ${o[2]}</div>`).join("");
 if(!ok){res.innerHTML+='<p class="bad">بعضی بخش‌ها اعمال نشد؛ فایل جدید ساخته نشد. این صفحه را برای من بفرستید.</p>';return}
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([src],{type:"text/html;charset=utf-8"}));
 a.download="index.html";document.body.appendChild(a);a.click();
 res.innerHTML+='<p class="ok"><b>تمام شد.</b> فایل index.html جدید دانلود شد.</p>';
};
</script>
</body>
</html>
