<style>
:root{--navy:#7eafd0;--gold:#ffffff;--gray:#6b6f76;--page:#7eafd0;--bg:#F2F8FC;--card:#FFFFFF;--ink:#1f2a24;--line:#CFE4F2;--ok:#1f7a5a;--warn:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#17364a;--bg:#122a3a;--card:#1d3c52;--ink:#ffffff;--line:#3a6a8a;--gray:#a8c8dc}}
:root[data-theme="dark"]{--page:#17364a;--bg:#122a3a;--card:#1d3c52;--ink:#ffffff;--line:#3a6a8a;--gray:#a8c8dc}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);line-height:1.8;background:var(--bg);background-size:cover;background-position:center;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
header{background:#7eafd0;color:var(--gold);padding:12px 18px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:17px;margin:0;flex:1;font-weight:700}
header small{opacity:.75}
.menugrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;position:relative}
.menugrid button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:var(--gold);color:#7eafd0;padding:10px 2px;border-radius:12px;cursor:pointer;font-weight:600;font-size:10.5px;position:relative;min-height:72px;line-height:1.3;overflow:hidden}
.ribbon{position:absolute;top:8px;left:-24px;background:#c0392b;color:#fff;font-size:8px;padding:2px 24px;transform:rotate(-45deg);z-index:2}
.menugrid button .ic{width:20px;height:20px}
.menugrid button .ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6}
main{max-width:860px;margin:0 auto;padding:16px;padding-bottom:78px;display:flex;flex-direction:column;min-height:calc(100vh - 120px)}
.bottombar{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-evenly;height:54px;background:var(--gold);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6;max-width:860px;margin:0 auto}
.bottombar button{flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:0;background:none;padding:8px;border-radius:99px;cursor:pointer;color:#7eafd0}
.bottombar button .ic{width:26px;height:26px;display:block}
.bottombar button .ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6}
.bottombar button.on .ic svg{stroke-width:2.4}
.bottombar button.on{background:#7eafd0;color:var(--gold)}
.bottombar button .ic img{width:100%;height:100%;object-fit:cover;border-radius:99px}
.bottombar button.on .ic img{outline:2px solid var(--gold,#ffffff);outline-offset:1px}
.card{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:16px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #7eafd0;box-shadow:0 0 0 4px var(--gold)}
.btn{background:var(--navy);color:#fff;border:0;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:500}
.btn.alt{background:var(--gold);color:#7eafd0}.btn.sm{padding:5px 12px;font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 10px;border-radius:99px;background:var(--bg);color:var(--gray);border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.wa{color:var(--warn);border-color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.meta{font-size:12px;color:var(--gray)}
.paper{background:repeating-linear-gradient(transparent,transparent 31px,var(--line) 32px);line-height:32px;padding:0 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;background-color:var(--card)}
.paper h4{margin:0;line-height:38px;border-bottom:2px solid var(--gold)}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
.login .top{background:var(--gold);border-bottom:4px solid #7eafd0;color:#7eafd0;border-radius:14px 14px 0 0;padding:26px;text-align:center}
.login .top h2{margin:0 0 4px}.login .card{border-radius:0 0 14px 14px;margin:0}
body.no-bgimg{background-image:none!important;background-color:var(--bg)}
.login input{background:#fff;color:#7eafd0}
.err{color:#c0392b;font-size:13px;min-height:20px}
.card .card{background:var(--bg);border:1px solid var(--line)}.ann{border-inline-start:4px solid var(--navy)!important}header .btn{background:var(--gold);color:#7eafd0}main>.meta{color:#fff}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modalbox{background:var(--card);border-radius:14px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;padding:20px 18px 18px;position:relative}
.modalbox h3{margin-top:0}
.modalclose{position:absolute;top:10px;left:10px;background:none;border:0;font-size:20px;cursor:pointer;color:var(--ink);line-height:1}
.msgrow{display:flex;gap:6px;margin-bottom:10px;align-items:flex-end}
.msgrow.me{justify-content:flex-start}
.msgrow.other{justify-content:flex-end}
.bubble{max-width:72%;padding:6px 10px 5px;border-radius:12px}
.bubble.me{background:#7eafd0;color:#fff;border-bottom-left-radius:3px}
.bubble.other{background:var(--card);border:1px solid var(--line);border-bottom-right-radius:3px}
.bubble .bname{font-size:12px;font-weight:700;margin-bottom:2px;color:var(--gold)}
.bubble.other .bname{color:#7eafd0}
.bubble .btext{font-size:13px;word-break:break-word}
.bubble .btime{font-size:10px;opacity:.7;text-align:left;margin-top:3px}
.datechip{text-align:center;margin:10px 0;position:sticky;top:0;z-index:3}
.datechip span{background:#7eafd0;color:var(--gold);padding:3px 12px;border-radius:99px;font-size:11px}
.chatbar{position:fixed;left:0;right:0;bottom:54px;max-width:860px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:4px;z-index:5}
.chatbar input{margin:0;flex:1}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.igcell{position:relative;aspect-ratio:1/1;overflow:hidden;cursor:pointer;border-radius:8px;border:2px solid var(--gold)}
@media (max-width:640px){.chat-reply{display:none}}
.igcell img{width:100%;height:100%;object-fit:cover;display:block}
.igframe{position:relative;width:100%;aspect-ratio:1/1;background:#000;overflow:hidden}
.igframe{overflow:hidden}
.igframe img{width:100%;height:100%;object-fit:contain;display:block;animation:igslide .25s ease-out;-webkit-user-drag:none;user-select:none}
.igframe img.from-left{animation-name:igslideL}
.igframe img.from-right{animation-name:igslideR}
@keyframes igslide{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@keyframes igslideL{from{opacity:0;transform:translateX(-30%)}to{opacity:1;transform:translateX(0)}}
@keyframes igslideR{from{opacity:0;transform:translateX(30%)}to{opacity:1;transform:translateX(0)}}
.igarrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);color:#fff;border:0;width:30px;height:30px;border-radius:99px;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.igarrow.left{left:8px}.igarrow.right{right:8px}
.igdots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.igdots span{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.5)}
.igdots span.on{background:#fff}
.bookgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-left:12px}
.bookcard{position:relative;background:#7eafd0;border-radius:12px;aspect-ratio:3/4;cursor:pointer;display:flex;align-items:flex-start;justify-content:center;box-shadow:2px 3px 6px rgba(0,0,0,.3);padding:12px 8px}
.bookcard::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;width:14px;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="24"><rect x="3" y="3" width="8" height="18" rx="4" fill="%23607d8b"/><circle cx="7" cy="12" r="3" fill="white"/></svg>');background-repeat:repeat-y;filter:drop-shadow(1px 1px 1px rgba(0,0,0,.3))}
.bicon{display:none}
.btitle{background:#fff;color:#333;font-size:11.5px;font-weight:700;text-align:center;padding:12px 6px;border-radius:6px;width:75%;margin-top:10px}
</style>

<script>
window.onerror=function(msg,src,line){try{alert("یک خطا رخ داد (لطفاً این پیام را به سازنده بدهید):\n"+msg+" — خط "+line)}catch(e){}return false};
function toast(msg){
 try{
  let t=document.getElementById("toastbox");
  if(!t){t=document.createElement("div");t.id="toastbox";t.style.cssText="position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#7eafd0;color:#ffffff;padding:10px 18px;border-radius:99px;font-size:13px;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.25);transition:opacity .3s";document.body.appendChild(t)}
  t.textContent=msg;t.style.opacity="1";
  clearTimeout(window.__toastT);window.__toastT=setTimeout(()=>{t.style.opacity="0"},1600);
 }catch(e){}
}

function qc(){
 const term=q.trim();
 const sel=window.__qcSel;

  const vals=new Map();

   if(r.c&&r.c.includes(term))vals.set("c|"+r.c,{type:"c",val:r.c});
   if(r.p&&r.p.includes(term))vals.set("p|"+r.p,{type:"p",val:r.p});
   if(r.o&&r.o.includes(term))vals.set("o|"+r.o,{type:"o",val:r.o});
  });
  sugg=[...vals.values()].slice(0,10);
 }
 let hits=[];
 if(sel){
  if(sel.type=="c")hits=S.qc.filter(r=>r.c==sel.val);
  else if(sel.type=="p")hits=S.qc.filter(r=>r.p==sel.val);

const JMONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
function persianParts(d){
 const f=new Intl.DateTimeFormat("en-US-u-ca-persian",{year:"numeric",month:"numeric",day:"numeric",timeZone:"UTC"});
 const o={};f.formatToParts(d).forEach(x=>o[x.type]=x.value);
 return {y:+o.year,m:+o.month,d:+o.day};
}
function jalaliToDate(jy,jm,jd){
 let est=new Date(Date.UTC(jy+621,2,20));
 est.setUTCDate(est.getUTCDate()+(jm-1)*30+(jd-1));
 for(let off=-20;off<=20;off++){const c=new Date(est.getTime()+off*86400000);const pp=persianParts(c);if(pp.y==jy&&pp.m==jm&&pp.d==jd)return c}
 return est;
}
function daysInJalaliMonth(jy,jm){for(let d=31;d>=29;d--){const pp=persianParts(jalaliToDate(jy,jm,d));if(pp.y==jy&&pp.m==jm&&pp.d==d)return d}return 29}
function isoFromJalali(jy,jm,jd){const dt=jalaliToDate(jy,jm,jd);return dt.getUTCFullYear()+"-"+String(dt.getUTCMonth()+1).padStart(2,"0")+"-"+String(dt.getUTCDate()).padStart(2,"0")}

function shift(){
 const g={};S.shifts.forEach(s=>{(g[s.date+"|"+s.sh]=g[s.date+"|"+s.sh]||[]).push(s)});
 const keys=Object.keys(g).sort().reverse();
 $("#v").innerHTML=`<div class="row" style="align-items:center"><h3 style="flex:1;margin:0">تحویل شیفت‌ها</h3>${can("shift")?`<button class="btn sm" id="shnew" style="flex:0 0 auto">+ ثبت جدید</button>`:""}</div>
 ${keys.length?keys.map(k=>{const [d,sh]=k.split("|");const items=g[k];const rec=S.shiftReceipts[k];
 const received=rec&&rec.upto>=items.length;
 return `<div class="card" data-shg="${k}" style="cursor:pointer"><b>${fd(d)} — شیفت ${sh}</b><br><span class="tag ${received?"ok":"wa"}">${received?"دریافت شده توسط "+esc(uname(rec.by)):"منتظر تأیید دریافت"}</span></div>`}).join(""):'<p class="meta">هنوز مطلبی ثبت نشده است.</p>'}`;

function openShiftDetail(k,items){

 openModal(`<h3>${fd(d)} — شیفت ${sh}</h3>

function openShiftModal(){
 const todayP=persianParts(new Date());
 window.__shY=todayP.y;window.__shM=todayP.m;window.__shD=todayP.d;
 window.__shLines=[];
 const yrs=[];for(let y=todayP.y-3;y<=todayP.y+1;y++)yrs.push(y);
 function render(){
  const dim=daysInJalaliMonth(window.__shY,window.__shM);
  if(window.__shD>dim)window.__shD=dim;
  return `<h3>ثبت تحویل شیفت</h3><div class="row">
 <select id="mshd">${Array.from({length:dim},(_,i)=>i+1).map(d=>`<option value="${d}" ${d==window.__shD?"selected":""}>${d}</option>`).join("")}</select>
 <select id="mshm">${JMONTHS.map((mn,i)=>`<option value="${i+1}" ${i+1==window.__shM?"selected":""}>${mn}</option>`).join("")}</select>
 <select id="mshy">${yrs.map(y=>`<option value="${y}" ${y==window.__shY?"selected":""}>${y}</option>`).join("")}</select>
 <select id="mss"><option value="روز">شیفت روز</option><option value="شب">شیفت شب</option></select></div>
 ${window.__shLines.length?`<div class="card">${window.__shLines.map((l,i)=>`<div>${i+1}. ${esc(l)}</div>`).join("")}</div>`:""}
 <input id="mst" placeholder="یک مورد را بنویسید و Enter بزنید">
 <button class="btn" id="msb">پایان و ثبت</button>`;
 }
 function wire(){
  $("#mshy").onchange=()=>{window.__shY=+$("#mshy").value;openModal(render());wire()};
  $("#mshm").onchange=()=>{window.__shM=+$("#mshm").value;openModal(render());wire()};
  $("#mshd").onchange=()=>{window.__shD=+$("#mshd").value};
  $("#mst").onkeydown=(e)=>{if(e.key=="Enter"){e.preventDefault();const v=$("#mst").value.trim();if(v){window.__shLines.push(v);openModal(render());wire();$("#mst").focus()}}};
  $("#msb").onclick=()=>{const v=$("#mst").value.trim();if(v)window.__shLines.push(v);
   if(!window.__shLines.length)return;
   const iso=isoFromJalali(window.__shY,window.__shM,window.__shD);
   const k=iso+"|"+$("#mss").value;
   window.__shLines.forEach(t=>S.shifts.push({id:nid(),date:iso,sh:$("#mss").value,t,by:me.id,at:Date.now()}));
   save("shifts");closeModal();shift()};
 }
 openModal(render());wire();
}

 ${p.comments.filter(r=>r.parent==c.id).map(r=>`<div style="margin-top:6px;display:flex;gap:6px">${avatar(r.by)}<div><b style="font-size:12px">${esc(uname(r.by))}</b><div style="font-size:12px">${esc(r.text)}</div>${r.by==me.id||me.role=="manager"?`<a href="#" data-cdel="${r.id}" style="color:#c0392b;font-size:11px">حذف</a>`:""}</div></div>`).join("")}

 $("#igback").onclick=()=>{window.__openPost=null;window.__piIdx=0;qcgram()};
 $("#iglike").onclick=()=>{p.likes=p.likes||[];const i=p.likes.indexOf(me.id);if(i>-1)p.likes.splice(i,1);else p.likes.push(me.id);save("posts");qcgramPost(id)};
 $("#iglikers").onclick=(e)=>{e.preventDefault();const ids=(p.likes||[]);openModal(`<h3>پسندیده‌شده توسط</h3>${ids.length?ids.map(uid=>`<div style="padding:7px 0;display:flex;align-items:center;gap:8px">${avatar(uid)}<span>${esc(uname(uid))}</span></div>`).join(""):'<p class="meta">هنوز کسی لایک نکرده است.</p>'}`)};
 document.querySelectorAll("[data-clike]").forEach(a=>a.onclick=(e)=>{e.preventDefault();const c=p.comments.find(x=>x.id==a.dataset.clike);c.likes=c.likes||[];const i=c.likes.indexOf(me.id);if(i>-1)c.likes.splice(i,1);else c.likes.push(me.id);save("posts");qcgramPost(id)});
 document.querySelectorAll("[data-cdel]").forEach(a=>a.onclick=(e)=>{e.preventDefault();p.comments=p.comments.filter(x=>x.id!=a.dataset.cdel&&x.parent!=a.dataset.cdel);save("posts");qcgramPost(id)});
 const frame=document.getElementById("igframe");
 if(frame&&p.images.length>1){
  const curImg=frame.querySelector("img");
  curImg.style.animation="none";curImg.style.position="relative";
  let sx=null,incoming=null,incomingDir=null;
  frame.style.touchAction="pan-y";
  function ensureIncoming(dir){
   if(incoming&&incomingDir===dir)return incoming;
   if(incoming)incoming.remove();
   const nIdx=dir=="next"?(window.__piIdx+1)%p.images.length:(window.__piIdx-1+p.images.length)%p.images.length;
   incoming=document.createElement("img");
   incoming.src=p.images[nIdx];incoming.draggable=false;
   incoming.style.cssText="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;animation:none;transition:none";
   incoming.style.transform=dir=="next"?"translateX(100%)":"translateX(-100%)";
   frame.appendChild(incoming);incomingDir=dir;return incoming;
  }
  frame.addEventListener("pointerdown",e=>{sx=e.clientX;curImg.style.transition="none";try{frame.setPointerCapture(e.pointerId)}catch(err){}});
  frame.addEventListener("pointermove",e=>{if(sx==null)return;const dx=e.clientX-sx;const dir=dx<0?"next":"prev";
   const img2=ensureIncoming(dir);
   curImg.style.transform=`translateX(${dx}px)`;
   img2.style.transform=dir=="next"?`translateX(calc(100% + ${dx}px))`:`translateX(calc(-100% + ${dx}px))`;
  });
  function finish(dx){
   const dir=incomingDir;const was=sx;sx=null;if(was==null)return;
   const threshold=frame.clientWidth*0.25;
   curImg.style.transition="transform .2s ease";
   if(incoming)incoming.style.transition="transform .2s ease";
   if(dir&&Math.abs(dx)>threshold){
    curImg.style.transform=dir=="next"?"translateX(-100%)":"translateX(100%)";
    if(incoming)incoming.style.transform="translateX(0)";
    window.__piIdx=dir=="next"?(window.__piIdx+1)%p.images.length:(window.__piIdx-1+p.images.length)%p.images.length;
    setTimeout(()=>qcgramPost(id),200);
   }else{
    curImg.style.transform="translateX(0)";
    if(incoming)incoming.style.transform=dir=="next"?"translateX(100%)":"translateX(-100%)";
   }
  }
  frame.addEventListener("pointerup",e=>finish(e.clientX-(sx??e.clientX)));
  frame.addEventListener("pointercancel",()=>finish(0));
 }
 let replyTo=null;
 document.querySelectorAll("[data-reply]").forEach(a=>a.onclick=(e)=>{e.preventDefault();replyTo=a.dataset.reply;$("#igcm").focus()});
 $("#igcb").onclick=()=>{const t=$("#igcm").value.trim();if(!t)return;p.comments.push({id:nid(),by:me.id,text:t,at:Date.now(),parent:replyTo,likes:[]});replyTo=null;save("posts");qcgramPost(id)};
}

function readKey(gid){return gid+":"+me.id}
function groupUnread(gid){const lr=S.reads[readKey(gid)]||0;return S.gmsgs.filter(m=>m.groupId==gid&&m.from!=me.id&&m.at>lr).length}
function totalUnread(){return S.groups.filter(g=>g.members.includes(me.id)).reduce((s,g)=>s+groupUnread(g.id),0)}
function markRead(gid){S.reads[readKey(gid)]=Date.now();save("reads")}

 ${mine.length?mine.map(g=>{const un=groupUnread(g.id);const last=S.gmsgs.filter(m=>m.groupId==g.id).slice(-1)[0];

function groupChat(gid){
 const g=S.groups.find(x=>x.id==gid);
 if(!g){window.__openGroup=null;return colleague()}
 if(groupUnread(gid)>0)markRead(gid);
 const msgs=S.gmsgs.filter(m=>m.groupId==gid).sort((a,b)=>a.at-b.at);
 const M=id=>S.gmsgs.find(x=>x.id==id);
 let lastDate=null;
 const rows=msgs.map(m=>{const rp=m.parent?M(m.parent):null;const mine=m.from==me.id;
 const dchip=fd(m.at);let chip="";
 if(dchip!=lastDate){chip=`<div class="datechip"><span>${dchip}</span></div>`;lastDate=dchip}
 const bubble=`<div class="bubble ${mine?"me":"other"}">
 ${!mine?`<div class="bname">${esc(uname(m.from))}</div>`:""}
 ${rp?`<div class="meta" data-jumpto="${rp.id}" style="opacity:.8;border-inline-start:2px solid currentColor;padding-inline-start:6px;margin-bottom:3px;cursor:pointer">${esc(uname(rp.from))}: ${esc((rp.text||"تصویر").slice(0,40))}</div>`:""}
 ${m.image?`<img src="${m.image}" style="width:200px;height:200px;object-fit:cover;border-radius:8px;margin-bottom:3px;display:block">`:""}

 return `${chip}<div class="msgrow ${mine?"me":"other"}" data-msgid="${m.id}">

 $("#v").innerHTML=`<div class="row" style="align-items:center"><button class="btn sm alt" id="gback" style="flex:0 0 auto">→ بازگشت</button><h3 style="flex:1;margin:0;cursor:pointer" id="gtitle">${esc(g.name)}</h3></div>
 <div style="max-height:60vh;overflow-y:auto;padding:4px" id="gmsgbox">${msgs.length?rows:'<p class="meta">هنوز پیامی نیست.</p>'}</div>
 <div class="meta" id="greplybox" style="display:none;margin:6px 0"></div>
 <div class="chatbar">
 <button class="btn sm" id="gsend" style="flex:0 0 auto;border-radius:99px;width:36px;height:36px;padding:0">➤</button>
 <input id="gtxt" placeholder="پیام...">
 <label style="cursor:pointer;padding:4px">📎<input type="file" id="gimg" accept="image/*" style="display:none"></label>
 <label style="cursor:pointer;padding:4px">📷<input type="file" id="gcam" accept="image/*" capture="environment" style="display:none"></label>
 </div>
 <div id="gsug" style="display:none;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:6px;overflow:hidden;position:fixed;bottom:100px;left:16px;right:16px;max-width:828px;margin:0 auto;z-index:7"></div>
 <div id="gmenu" style="display:none;position:fixed;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:20;overflow:hidden"></div>`;
 const box=$("#gmsgbox");
 if(window.__gWasNearBottom!==false)box.scrollTop=box.scrollHeight;
 box.style.paddingBottom="8px";
 box.onscroll=()=>{window.__gWasNearBottom=(box.scrollTop+box.clientHeight>=box.scrollHeight-60)};
 $("#v").style.paddingBottom="140px";
 $("#gback").onclick=()=>{window.__openGroup=null;window.__gWasNearBottom=undefined;colleague()};
 $("#gtitle").onclick=()=>groupInfo(gid);
 let replyTo=null,editingId=null;
 function setReply(mid){replyTo=mid;const rm=M(mid);
  $("#greplybox").style.display="block";$("#greplybox").innerHTML=`در پاسخ به ${esc(uname(rm.from))}: ${esc((rm.text||"تصویر").slice(0,40))} <a href="#" id="gcancelreply">✕</a>`;
  document.getElementById("gcancelreply").onclick=(ev)=>{ev.preventDefault();replyTo=null;$("#greplybox").style.display="none"};
  $("#gtxt").focus();}
 function startEdit(m){editingId=m.id;$("#gtxt").value=m.text||"";
  $("#greplybox").style.display="block";$("#greplybox").innerHTML=`در حال ویرایش پیام <a href="#" id="gcanceledit">✕</a>`;
  document.getElementById("gcanceledit").onclick=(ev)=>{ev.preventDefault();editingId=null;$("#gtxt").value="";$("#greplybox").style.display="none"};
  $("#gtxt").focus();}
 function closeMenu(){const gm=document.getElementById("gmenu");if(gm)gm.style.display="none"}
 function openMsgMenu(m,x,y){
  const mine=m.from==me.id;
  const items=[];
  items.push(["پاسخ",()=>{setReply(m.id);closeMenu()}]);
  if(m.image){items.push(["اشتراک‌گذاری",async()=>{closeMenu();if(navigator.share){try{await navigator.share({url:m.image})}catch(e){}}else{navigator.clipboard&&navigator.clipboard.writeText(m.image)}}])}
  else{if(m.text)items.push(["کپی",()=>{navigator.clipboard&&navigator.clipboard.writeText(m.text);closeMenu()}]);
   if(mine&&m.text)items.push(["ویرایش",()=>{closeMenu();startEdit(m)}]);}
  items.push(["انتقال",()=>{closeMenu();openForwardModal(m)}]);
  if(mine||me.role=="manager")items.push(["حذف",()=>{closeMenu();if(!confirm("این پیام برای همه حذف شود؟"))return;S.gmsgs=S.gmsgs.filter(x=>x.id!=m.id);save("gmsgs");groupChat(gid)}]);
  const menu=$("#gmenu");
  menu.innerHTML=items.map(([label],i)=>`<div data-mi="${i}" style="padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--line)">${label}</div>`).join("");
  menu.style.display="block";
  const mw=180,vw=window.innerWidth,vh=window.innerHeight;
  menu.style.left=Math.min(x,vw-mw-10)+"px";menu.style.top=Math.min(y,vh-220)+"px";
  menu.querySelectorAll("[data-mi]").forEach(el=>el.onclick=(e)=>{e.stopPropagation();items[+el.dataset.mi][1]()});
  setTimeout(()=>document.addEventListener("click",closeMenu,{once:true}),0);
 }
 document.querySelectorAll("[data-jumpto]").forEach(el=>el.onclick=()=>{const target=document.querySelector(`[data-msgid="${el.dataset.jumpto}"]`);

  row.oncontextmenu=(e)=>{e.preventDefault();e.stopPropagation();openMsgMenu(m,e.clientX,e.clientY)};
  let t=null;
  row.addEventListener("touchstart",(e)=>{t=setTimeout(()=>{const touch=e.touches[0];openMsgMenu(m,touch.clientX,touch.clientY)},500)});
  row.addEventListener("touchend",()=>clearTimeout(t));
  row.addEventListener("touchmove",()=>clearTimeout(t));
 });
 const memberNames=g.members.filter(id=>id!=me.id).map(id=>uname(id));
 $("#gtxt").oninput=()=>{
  const v=$("#gtxt").value;
  const mm=v.match(/@([^\s@]*)$/);
  const sug=$("#gsug");
  if(!mm){sug.style.display="none";sug.innerHTML="";return}
  const partial=mm[1];
  const matches=memberNames.filter(n=>n.includes(partial));
  if(!matches.length){sug.style.display="none";sug.innerHTML="";return}
  sug.style.display="block";
  sug.innerHTML=matches.map(n=>`<div data-mn="${esc(n)}" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)">@${esc(n)}</div>`).join("");
  sug.querySelectorAll("[data-mn]").forEach(el=>el.onclick=()=>{
   $("#gtxt").value=v.slice(0,mm.index)+"@"+el.dataset.mn+" ";
   sug.style.display="none";sug.innerHTML="";$("#gtxt").focus();
  });
 };
 $("#gtxt").onkeydown=(e)=>{if(e.key=="Enter"){e.preventDefault();doSend()}};
 async function doSend(image){
  if(editingId){const t=$("#gtxt").value.trim();if(!t)return;const m=M(editingId);m.text=t;m.edited=true;editingId=null;$("#greplybox").style.display="none";save("gmsgs");groupChat(gid);return}
  const t=$("#gtxt").value.trim();if(!t&&!image)return;
  S.gmsgs.push({id:nid(),groupId:gid,from:me.id,text:t,image:image||null,at:Date.now(),parent:replyTo});
  replyTo=null;window.__gWasNearBottom=true;markRead(gid);save("gmsgs");groupChat(gid);
 }
 $("#gsend").onclick=()=>doSend();
 $("#gimg").onchange=async()=>{const f=$("#gimg").files[0];if(!f)return;const url=await uploadImage(f);doSend(url)};
 $("#gcam").onchange=async()=>{const f=$("#gcam").files[0];if(!f)return;const url=await uploadImage(f);doSend(url)};
}

 openModal(`<h3>انتقال پیام به...</h3>${mine.map(g=>`<div data-fwg="${g.id}" style="padding:10px;cursor:pointer;border-bottom:1px solid var(--line)">${esc(g.name)}</div>`).join("")}`);

}

function train(){

 ${S.trainings.length?`<div class="bookgrid">${S.trainings.map(t=>`<div class="bookcard" data-op="${t.id}"><div class="bicon">📘</div><div class="btitle">${esc(t.title)}</div></div>`).join("")}</div>`:'<p class="meta">هنوز مطلبی ثبت نشده است.</p>'}`;
 if(can("train"))$("#trnew").onclick=()=>openTrainModal();
 document.querySelectorAll("[data-op]").forEach(b=>b.onclick=()=>{const t=S.trainings.find(x=>x.id==b.dataset.op);if(!t)return;
  const media=t.image?(t.kind=="pdf"?`<p><a href="${t.image}" target="_blank" class="tag">📄 مشاهده فایل پی‌دی‌اف</a></p>`:`<img src="${t.image}" style="width:100%;border-radius:8px;margin-bottom:8px">`):"";
  openModal(`<h3>${esc(t.title)}</h3>${media}<p>${esc(t.text)}</p><div class="meta">${esc(uname(t.by))} · ${fd(t.at,1)}</div>`)});
}
function openTrainModal(){
 openModal(`<h3>مطلب آموزشی جدید</h3><input id="mtrt" placeholder="عنوان"><textarea id="mtrx" rows="3" placeholder="متن آموزشی"></textarea><input type="file" id="mtri" accept="image/*,application/pdf,.pdf"><div class="err" id="mtre"></div><button class="btn sm" id="mtrb">ثبت</button>`);
 $("#mtrb").onclick=async()=>{const ti=$("#mtrt").value.trim(),tx=$("#mtrx").value.trim();if(!ti||!tx)return $("#mtre").textContent="عنوان و متن را وارد کنید.";
  const f=$("#mtri").files[0];const image=f?await uploadImage(f):null;const kind=f&&(f.type=="application/pdf"||f.name.toLowerCase().endsWith(".pdf"))?"pdf":"image";
  S.trainings.push({id:nid(),title:ti,text:tx,image,kind,by:me.id,at:Date.now()});save("trainings");closeModal();train()};
}

const NCSTAGE={l1:"نزد بررسی‌کننده",l2:"نزد سطح دو",l1review:"بازبینی سطح یک",creator:"نزد ثبت‌کننده",closed:"بسته"};
function nc(){
 if(window.__openNc)return ncDetail(window.__openNc);
 const mine=S.nc.filter(n=>n.by==me.id||n.l1==me.id||n.l2==me.id||me.role=="manager");
 const sorted=mine.slice().sort((a,b)=>(a.stage=="closed")-(b.stage=="closed")||b.at-a.at);
 const others=S.users.filter(u=>u.on&&u.id!=me.id&&S.perms.ncresponder.includes(u.role));
 $("#v").innerHTML=`<div class="row" style="align-items:center"><h3 style="flex:1;margin:0">عدم انطباق‌ها</h3>${can("nc")?`<button class="btn sm" id="ncnew" style="flex:0 0 auto">+ ثبت جدید</button>`:""}</div>
 ${sorted.length?sorted.map(n=>{
  const closed=n.stage=="closed";
  const isNew=n.holder==me.id&&n.trail.length&&n.trail[n.trail.length-1].at>(S.ncSeen[n.id+":"+me.id]||0);
  return `<div class="card" data-onc="${n.id}" style="cursor:pointer;${closed?"opacity:.6":""}">${isNew?'<span class="tag wa">جدید</span> ':""}<b>${esc(n.subject)}</b> <span class="tag ${closed?"ok":"wa"}">${NCSTAGE[n.stage]||n.stage}</span><div class="meta">${fd(n.at,1)}</div></div>`;
 }).join(""):'<p class="meta">موردی برای نمایش نیست.</p>'}
 ${me.role=="manager"?ncReport():""}`;
 if(can("nc"))$("#ncnew").onclick=()=>openNcModal(others);
 document.querySelectorAll("[data-onc]").forEach(c=>c.onclick=()=>{window.__openNc=+c.dataset.onc;nc()});
}
function ncCauseForm(){
 return `<div class="card"><h3>نتیجه‌گیری نهایی</h3><select id="ncc_cause"><option value="">عامل را انتخاب کنید</option><option value="human">نیروی انسانی</option><option value="method">روش کار</option></select>
 <div id="ncc_offwrap" style="display:none"><p class="meta">افراد خاطی (چندتایی قابل‌انتخاب):</p><select multiple id="ncc_off" style="min-height:70px">${S.users.filter(u=>u.on).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select></div>
 <textarea id="ncc_corr" rows="2" placeholder="اقدام اصلاحی"></textarea>
 <button class="btn sm" id="ncc_go">تکمیل و ارسال برای ثبت‌کننده</button></div>`;
}
function wireCauseForm(n){
 const causeSel=document.getElementById("ncc_cause");if(!causeSel)return;
 causeSel.onchange=()=>{document.getElementById("ncc_offwrap").style.display=causeSel.value=="human"?"block":"none"};
 document.getElementById("ncc_go").onclick=()=>{
  const cause=causeSel.value;const corr=document.getElementById("ncc_corr").value.trim();
  if(!cause||!corr)return;
  const offs=cause=="human"?[...document.getElementById("ncc_off").selectedOptions].map(o=>+o.value):[];
  n.cause=cause;n.offenders=offs;n.corrective=corr;n.stage="creator";n.holder=n.by;
  n.trail.push({type:"نتیجه‌گیری",from:me.id,to:n.by,note:corr,at:Date.now()});
  save("nc");window.__openNc=null;nc();
 };
}
function ncDetail(id){
 const n=S.nc.find(x=>x.id==id);
 if(!n){window.__openNc=null;return nc()}
 S.ncSeen[n.id+":"+me.id]=Date.now();save("ncSeen");
 const CAUSE={human:"نیروی انسانی",method:"روش کار"};
 $("#v").innerHTML=`<button class="btn sm alt" id="ncback" style="margin-bottom:10px">→ بازگشت</button>
 <div class="card"><h3>${esc(n.subject)}</h3><p>${esc(n.desc)}</p><span class="tag ${n.stage=="closed"?"ok":"wa"}">${NCSTAGE[n.stage]||n.stage}</span></div>
 <div class="card"><h3>گردش</h3>${n.trail.map(h=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(h.type)}</b><div class="meta">از: ${esc(uname(h.from))}${h.to?" · به: "+esc(uname(h.to)):""} · ${fd(h.at,1)}</div>${h.note?`<p>${esc(h.note)}</p>`:""}</div>`).join("")}</div>
 ${n.cause?`<div class="card"><p>عامل: ${CAUSE[n.cause]||""} ${n.offenders&&n.offenders.length?"· افراد: "+n.offenders.map(uname).join("، "):""}</p>${n.corrective?`<p>اقدام اصلاحی: ${esc(n.corrective)}</p>`:""}</div>`:""}
 <div id="ncactions"></div>`;
 $("#ncback").onclick=()=>{window.__openNc=null;nc()};
 const ac=document.getElementById("ncactions");
 if(n.stage=="l1"&&n.l1==me.id){
  const subs=S.users.filter(u=>u.on&&u.id!=me.id&&S.chart[u.id]==n.l1);
  ac.innerHTML=`<div class="card"><h3>ارجاع جهت بررسی</h3>${subs.length?`<select id="ncfwd">${subs.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select><input id="ncfwdnote" placeholder="یادداشت (اختیاری)"><button class="btn sm" id="ncfwdgo">ارجاع</button>`:'<p class="meta">در چارت سازمانی، کسی زیرمجموعه‌ی شما ثبت نشده است.</p>'}</div>
  ${ncCauseForm()}`;
  const fg=document.getElementById("ncfwdgo");if(fg)fg.onclick=()=>{const to=+document.getElementById("ncfwd").value;const note=document.getElementById("ncfwdnote").value.trim();
   n.l2=to;n.holder=to;n.stage="l2";n.trail.push({type:"ارجاع جهت بررسی",from:me.id,to,note,at:Date.now()});save("nc");window.__openNc=null;nc()};
  wireCauseForm(n);
 }else if(n.stage=="l2"&&n.l2==me.id){
  ac.innerHTML=`<div class="card"><h3>توضیحات</h3><textarea id="ncl2note" rows="3" placeholder="یافته‌ها و توضیحات"></textarea><button class="btn sm" id="ncl2go">ارسال به سطح اول</button></div>`;
  document.getElementById("ncl2go").onclick=()=>{const note=document.getElementById("ncl2note").value.trim();if(!note)return;
   n.holder=n.l1;n.stage="l1review";n.trail.push({type:"پاسخ سطح دو",from:me.id,to:n.l1,note,at:Date.now()});save("nc");window.__openNc=null;nc()};
 }else if(n.stage=="l1review"&&n.l1==me.id){
  ac.innerHTML=`<div class="card"><h3>بازگشت جهت بررسی مجدد به سطح دو</h3><textarea id="ncretnote" rows="2" placeholder="توضیح"></textarea><button class="btn sm alt" id="ncretgo">ارسال</button></div>
  ${ncCauseForm()}`;
  document.getElementById("ncretgo").onclick=()=>{const note=document.getElementById("ncretnote").value.trim();if(!note)return;
   n.holder=n.l2;n.stage="l2";n.trail.push({type:"بازگشت جهت بررسی مجدد",from:me.id,to:n.l2,note,at:Date.now()});save("nc");window.__openNc=null;nc()};
  wireCauseForm(n);
 }else if(n.stage=="creator"&&n.by==me.id){
  ac.innerHTML=`<div class="card"><button class="btn sm" id="ncapprove">تأیید</button> <button class="btn sm alt" id="ncreturn">بازگشت جهت بررسی مجدد</button><div id="ncretwrap" style="display:none;margin-top:8px"><textarea id="ncretreason" rows="2" placeholder="توضیح"></textarea><button class="btn sm" id="ncretsend">ارسال</button></div></div>`;
  document.getElementById("ncapprove").onclick=()=>{n.stage="closed";n.trail.push({type:"تأیید و بستن",from:me.id,at:Date.now()});save("nc");window.__openNc=null;nc()};
  document.getElementById("ncreturn").onclick=()=>{document.getElementById("ncretwrap").style.display="block"};
  document.getElementById("ncretsend").onclick=()=>{const note=document.getElementById("ncretreason").value.trim();if(!note)return;
   n.holder=n.l1;n.stage="l1";n.trail.push({type:"بازگشت توسط ثبت‌کننده",from:me.id,to:n.l1,note,at:Date.now()});save("nc");window.__openNc=null;nc()};
 }
}
function openNcModal(others){
 openModal(`<h3>ثبت عدم انطباق جدید</h3><input id="mns" placeholder="موضوع"><textarea id="mnd" rows="2" placeholder="شرح"></textarea><select id="mnto">${others.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select><div class="err" id="mne"></div><button class="btn sm" id="mnb">ارسال</button>`);
 $("#mnb").onclick=()=>{const su=$("#mns").value.trim(),de=$("#mnd").value.trim(),l1=+$("#mnto").value;
  if(!su||!de)return $("#mne").textContent="موضوع و شرح را وارد کنید.";
  S.nc.push({id:nid(),subject:su,desc:de,by:me.id,at:Date.now(),l1,l2:null,holder:l1,stage:"l1",cause:"",offenders:[],corrective:"",trail:[{type:"ایجاد و ارجاع",from:me.id,to:l1,note:de,at:Date.now()}]});save("nc");closeModal();nc()};
}
function suggUnread(){
 if(me.role=="manager")return S.suggestions.filter(s=>s.by!=me.id&&s.at>(S.suggReads[me.id]||0)).length;
 return S.suggestions.filter(s=>s.by==me.id&&s.reply&&s.replyAt>(S.suggReads[me.id]||0)).length;
}
function complaintsUnseen(){return S.complaints.filter(c=>!S.complaintSeen[c.id+":"+me.id]).length}
function ncNewCount(){return S.nc.filter(n=>n.holder==me.id&&n.trail.length&&n.trail[n.trail.length-1].at>(S.ncSeen[n.id+":"+me.id]||0)).length}
function suggestions(){
 if(suggUnread()>0){S.suggReads[me.id]=Date.now();save("suggReads")}
 if(me.role=="manager"){
  const list=S.suggestions.slice().reverse();
  $("#v").innerHTML=`<h3>صندوق انتقادات و پیشنهادات</h3>
  ${list.length?list.map(s=>`<div class="card">${!s.reply?'<span class="tag wa">بدون پاسخ</span>':'<span class="tag ok">پاسخ داده شده</span>'}
  <p>${esc(s.text)}</p><div class="meta">${esc(uname(s.by))} · ${fd(s.at,1)}</div>
  ${s.reply?`<div class="card"><b>پاسخ:</b> ${esc(s.reply)}<div class="meta">${fd(s.replyAt,1)}</div></div>`:`<textarea data-sr="${s.id}" rows="2" placeholder="پاسخ شما"></textarea><button class="btn sm" data-sb="${s.id}">ارسال پاسخ</button>`}
  </div>`).join(""):'<p class="meta">موردی ثبت نشده است.</p>'}`;
  document.querySelectorAll("[data-sb]").forEach(b=>b.onclick=()=>{const id=+b.dataset.sb;const s=S.suggestions.find(x=>x.id==id);
   const r=document.querySelector(`[data-sr="${id}"]`).value.trim();if(!r)return;s.reply=r;s.replyAt=Date.now();save("suggestions");suggestions()});
 }else{
  const mine=S.suggestions.filter(s=>s.by==me.id).slice().reverse();
  $("#v").innerHTML=`<div class="card"><h3>ارسال انتقاد یا پیشنهاد</h3><textarea id="sgt" rows="3" placeholder="متن خود را بنویسید"></textarea><button class="btn sm" id="sgb">ارسال</button></div>
  ${mine.length?`<h3>موارد ارسالی شما</h3>${mine.map(s=>`<div class="card">${!s.reply?'<span class="tag wa">بدون پاسخ</span>':'<span class="tag ok">پاسخ داده شده</span>'}<p>${esc(s.text)}</p><div class="meta">${fd(s.at,1)}</div>${s.reply?`<div class="card"><b>پاسخ مدیریت:</b> ${esc(s.reply)}</div>`:""}</div>`).join("")}`:""}`;
  $("#sgb").onclick=()=>{const t=$("#sgt").value.trim();if(!t)return;S.suggestions.push({id:nid(),by:me.id,text:t,at:Date.now(),reply:null,replyAt:null});save("suggestions");suggestions()};
 }
}
function complaints(){
 const openId=window.__openComplaint;
 if(openId){
  const c=S.complaints.find(x=>x.id==openId);
  if(c){
   if(!S.complaintSeen[c.id+":"+me.id]){S.complaintSeen[c.id+":"+me.id]=true;save("complaintSeen")}
   $("#v").innerHTML=`<button class="btn sm alt" id="cxback" style="margin-bottom:12px">→ بازگشت</button>
   <div class="card"><h3>${esc(c.subject)}</h3><p>${esc(c.text)}</p>
   ${c.images&&c.images.length?`<div style="display:flex;gap:6px;overflow-x:auto">${c.images.map(im=>`<img src="${im}" style="width:70%;flex:0 0 auto;max-height:220px;object-fit:cover;border-radius:8px">`).join("")}</div>`:""}
   <div class="meta">${esc(uname(c.by))} · ${fd(c.at,1)}</div></div>`;
   $("#cxback").onclick=()=>{window.__openComplaint=null;complaints()};
   return;
  }
  window.__openComplaint=null;
 }
 const list=S.complaints.slice().reverse();
 $("#v").innerHTML=`<div class="row" style="align-items:center"><h3 style="flex:1;margin:0">شکایات</h3>${can("complaint")?`<button class="btn sm" id="cxnew" style="flex:0 0 auto">+ افزودن شکایت</button>`:""}</div>
 ${list.length?list.map(c=>`<div class="card" data-oc="${c.id}" style="cursor:pointer">${!S.complaintSeen[c.id+":"+me.id]?'<span class="tag wa">جدید</span> ':""}<b>${esc(c.subject)}</b><div class="meta">${esc(uname(c.by))} · ${fd(c.at,1)}</div></div>`).join(""):'<p class="meta">شکایتی ثبت نشده است.</p>'}`;
 document.querySelectorAll("[data-oc]").forEach(d=>d.onclick=()=>{window.__openComplaint=+d.dataset.oc;complaints()});
 const nb=document.getElementById("cxnew");if(nb)nb.onclick=()=>openComplaintModal();
}
function openComplaintModal(){
 openModal(`<h3>ثبت شکایت جدید</h3><input id="mcs" placeholder="موضوع"><textarea id="mct" rows="3" placeholder="متن شکایت"></textarea><input type="file" id="mci" accept="image/*" multiple><div class="err" id="mce"></div><button class="btn sm" id="mcb">ثبت</button>`);
 $("#mcb").onclick=async()=>{const su=$("#mcs").value.trim(),tx=$("#mct").value.trim();if(!su||!tx)return $("#mce").textContent="موضوع و متن را وارد کنید.";
  const files=[...$("#mci").files];const images=files.length?await Promise.all(files.map(uploadImage)):[];
  S.complaints.push({id:nid(),by:me.id,subject:su,text:tx,images,at:Date.now()});save("complaints");closeModal();complaints()};
}
function ncReport(){
 const off={},cau={human:0,method:0};let open=0,closed=0;
 S.nc.forEach(n=>{n.stage=="closed"?closed++:open++;if(n.cause)cau[n.cause]++;(n.offenders||[]).forEach(o=>off[o]=(off[o]||0)+1)});
 return `<div class="card"><h3>گزارش عدم انطباق‌ها</h3><p>باز: ${open} · بسته: ${closed}</p><p>نیروی انسانی: ${cau.human} · روش کار: ${cau.method}</p>
 ${Object.keys(off).length?`<p>افراد خاطی:<br>${Object.entries(off).map(([id,c])=>`${esc(uname(id))}: ${c}`).join("<br>")}</p>`:""}</div>`;
}


boot();
</script>
</body>
